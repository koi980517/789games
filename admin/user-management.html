button{font:inherit;cursor:pointer}

.page{min-width:0;padding:16px;display:flex;flex-direction:column;gap:12px}

.bar .lab{color:var(--quiet)}

select,input[type=text],input[type=number],input[type=password],textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:5px 8px;min-width:0}
textarea{width:100%;min-height:56px}
.btn{border:1px solid var(--brand);background:var(--brand);color:var(--brand-ink);border-radius:4px;padding:5px 14px}

table{border-collapse:collapse;width:100%}
th,td{border-bottom:1px solid var(--line);padding:8px;text-align:center;vertical-align:middle}
th{background:var(--soft);font-weight:600;font-size:12px;color:var(--quiet)}

.lk{background:none;border:0;padding:0;color:var(--link)}

[data-spec]{position:relative}
body.mark [data-spec]{outline:1px dashed var(--warn);outline-offset:2px}
body.mark [data-spec].issue::after{content:"!";position:absolute;top:-8px;right:-8px;width:15px;height:15px;border-radius:50%;background:var(--warn);color:var(--panel);font-size:10px;line-height:15px;text-align:center;font-weight:700}

.dlg .bd .lab.req::before{content:"* ";color:#d14b4b}
.dlg .bd .ro{color:var(--ink)}
.dlg .bd .full{grid-column:1/-1}

.radios{display:flex;flex-wrap:wrap;gap:4px 14px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px 20px}
.form .f{display:flex;flex-direction:column;gap:4px}
.form .f .lab.req::before{content:"* ";color:#d14b4b}

.tabs span.on{border-color:var(--brand);color:var(--ink)}

.share label{display:flex;justify-content:space-between;gap:6px;align-items:center;border:1px solid var(--line);border-radius:4px;padding:4px 8px}

.lg{width:100%;height:auto;display:block}
.lg .bx{fill:var(--panel);stroke:var(--quiet);stroke-width:1.2}
.lg .bx.main{fill:var(--brand-soft);stroke:var(--brand);stroke-width:1.6}

.lg .ln{font:12px var(--font);fill:var(--quiet)}
.lg .lb{font:11.5px var(--font);fill:var(--quiet)}
.lg .lb.bad{fill:var(--warn);font-weight:600}
.lg .ed{fill:none;stroke:var(--quiet);stroke-width:1.2}
.lg .ed.dash{stroke-dasharray:5 4}
.lg .ed.bad{stroke:var(--warn)}
.lg .hd{font:600 15px var(--font);fill:var(--ink)}
.rpt th,.rpt td{white-space:nowrap}
.mx td,.mx th{text-align:left;vertical-align:top;font-size:12px}

function dlg(title,rows,opts={}){
  const body=rows.map(r=>{ if(r.full) return `<div class="full">${r.full}</div>`;
    const lab=`<div class="lab${r.req?' req':''}">${esc(r.l)}</div>`; let c='';
    if(r.ro!==undefined) c=`<div class="ro">${esc(r.ro)}</div>`;
    else if(r.sel) c=`<select>${r.ph?`<option>${esc(r.ph)}</option>`:''}${r.sel.map(o=>`<option>${esc(o)}</option>`).join('')}</select>`;
    else if(r.rad) c=`<span class="radios">${r.rad.map((o,i)=>`<label><input type="radio" name="d${esc(r.l)}"${o===r.val?' checked':''}> ${esc(o)}</label>`).join('')}</span>`;
    else if(r.ta) c=`<textarea></textarea>`;
    else c=`<input type="${r.type||'text'}" placeholder="${esc(r.ph||'请输入')}" value="${esc(r.val||'')}">`;
    return lab+c+(r.after?`<div></div><div class="hint">${r.after}</div>`:''); }).join('');
  const foot=opts.foot||`<button class="btn plain" data-close>取 消</button><button class="btn" data-ok>确 定</button>`;
  $('#modalRoot').innerHTML=`<div class="modal" data-close><div class="dlg" role="dialog" aria-label="${esc(title)}"><header>${esc(title)}<button class="x" data-close aria-label="关闭">×</button></header><div class="bd">${body}</div><footer>${foot}</footer></div></div>`;
}

document.addEventListener('click',e=>{
  const pick=e.target.closest('[data-pick]');
  const gv=e.target.closest('[data-goto-v]'); if(gv){location.hash=gv.dataset.gotoV;return}
  if(pick&&pick.dataset.goto){window.__pending=pick.dataset.pick;location.hash=pick.dataset.goto;return}
  if(pick){showSpec(pick.dataset.pick);document.querySelector(`[data-spec="${pick.dataset.pick}"]`)?.scrollIntoView({block:'center',behavior:'smooth'});return}
  const m=e.target.closest('.modal');
  if(m){ if(e.target.closest('[data-ok]')){$('#modalRoot').innerHTML='';toast('原型：已模拟提交，未写入任何数据');return}
    const act=e.target.closest('[data-act]');
    if(act&&act.dataset.act==='go'){$('#modalRoot').innerHTML='';location.hash=act.dataset.to;return}
    if(act&&act.dataset.act==='noop'){toast('原型：仅展示');return}
    if(act&&act.dataset.act==='mdlg'){const d=act.dataset.d;DLG[d](window.__mctx||MEM[0]);showSpec(d.startsWith('m-pwd')?'m-pwd':d);return}
    if(e.target.closest('[data-close]')&&(e.target.matches('[data-close]')||e.target.closest('button[data-close]'))) $('#modalRoot').innerHTML='';
    return; }
  const specEl=e.target.closest('[data-spec]'); if(specEl) showSpec(specEl.dataset.spec);
  const a=e.target.closest('[data-act]'); if(!a) return;
  const act=a.dataset.act;
  if(act==='go'){location.hash=a.dataset.to}
  else if(act==='search'){filt={st:$('#fSt').value,by:$('#fBy').value,kw:$('#fKw').value.trim(),g:$('#fG').value};render();toast('已按条件筛选（示例数据）')}
  else if(act==='drill'){ctx=STATIONS[+a.dataset.i];location.hash='agent-drill'}
  else if(act==='op'){ctx=STATIONS[+a.dataset.i];const op=a.dataset.op;
    if(op==='op-subacc') location.hash='sub-account'; else if(op==='op-role') location.hash='sub-role'; else if(op==='op-ip') location.hash='station-ip'; else DLG[op](ctx);}
  else if(act==='dlg'){DLG[a.dataset.d](viewName()==='big-agent'||viewName()==='agent'||viewName()==='member'||viewName()==='agent-invite'?actx:ctx,a.dataset.title)}
  else if(act==='bop'){actx=BIG[+a.dataset.i];const op=a.dataset.op;window.__inviteFrom='big-agent';
    if(op==='b-bill') location.hash='user-bill'; else if(op==='b-invite') location.hash='agent-invite'; else if(op==='b-vipbill') location.hash='agent-vip-bill'; else DLG[op](actx);}
  else if(act==='aop'){actx=AGT[+a.dataset.i];const op=a.dataset.op;window.__inviteFrom='agent';
    if(op==='a-invite') location.hash='agent-invite'; else if(op==='a-edit') DLG['a-edit'](actx); else DLG[op.replace('a-','b-')](actx);}
  else if(act==='bdrill'){actx=BIG[+a.dataset.i];
    if(a.dataset.k==='d'){banner=`下钻：只看大代理 ${esc(actx.acc)} 下的代理（queryCode / superUserId）。`;location.hash='agent'}
    else{window.__memSearched=false;banner='';toast('跳到会员页：列表不会自动查询，显示 No Data');location.hash='member'}}
  else if(act==='unbanner'){banner='';location.hash='big-agent'}
  else if(act==='back-invite'){location.hash=window.__inviteFrom||'big-agent'}
  else if(act==='copy'){const link='https://qa.789games.com/?code=1234_sandy';(navigator.clipboard?navigator.clipboard.writeText(link):Promise.reject()).then(()=>toast('已复制（示例链接）')).catch(()=>toast('示例链接：'+link))}
  else if(act==='msearch'){window.__memSearched=true;render();toast('显示 11-06 采集的示例数据（所属代理 = 5ji-wanghong）')}
  else if(act==='noexport'){toast('原型：导出会下载文件，梳理时未点击')}
  else if(act==='mop'){const op=a.dataset.op; if(a.dataset.i!==undefined) window.__mctx=MEM[+a.dataset.i];
    if(op==='m-bill'){actx={acc:'会员',id:''};location.hash='user-bill'} else if(op==='m-es') toast('原型：ES数据同步可能直接执行，梳理时未点击'); else DLG[op](window.__mctx||MEM[0]);}
  else if(act==='rclv'){rcLevel=+a.dataset.l;render()}
  else if(act==='rcdown'){if(rcLevel<3){rcLevel++;render()}else toast('原型：下级代理可以继续下钻，示例只做到这一层')}
  else if(act==='kick'){toast('原型：踢下线会立即生效，梳理时未点击')}
  else if(act==='mbal'){DLG['m-balance'](null,a.dataset.b)}
  else if(act==='submit'){toast('原型：已模拟提交，未创建投注站')}
  else if(act==='quick'){const v=$('#quick').value;document.querySelectorAll('.pct').forEach(i=>i.value=v);toast('已应用到全部厂商')}
  else if(act==='noop'){toast('原型：仅展示')}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#modalRoot').innerHTML=''});
const mt=$('#markToggle');
function applyMark(){document.body.classList.toggle('mark',mt.checked);try{localStorage.setItem('mark',mt.checked?'1':'0')}catch(err){}}
try{const m=localStorage.getItem('mark'); if(m==='0') mt.checked=false}catch(err){}
mt.addEventListener('change',applyMark); applyMark();
window.addEventListener('hashchange',()=>{selected=window.__pending||null;window.__pending=null;if(viewName()!=='agent')banner='';render();window.scrollTo(0,0);if(selected){const el=document.querySelector(`[data-spec="${selected}"]`);el&&el.scrollIntoView({block:'center'})}});
render();
</script>
