<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GAMES 运营报表原型</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: 后台壳（顶栏 + 左侧菜单）+ 主区（筛选条 → 同步状态 → 报表表格 → 字段说明） */
:root{
  --bg:#f3f5f4; --panel:#ffffff; --fg:#17201f; --muted:#5d6b69; --line:#dfe5e3; --line-strong:#c7d1ce;
  --accent:#0d6b63; --accent-soft:#e2f0ee; --head:#eef3f1; --total:#fbf5e6; --total-fg:#5a4410;
  --ok:#1f7a3f; --warn:#a15c00; --nav:#14302d; --nav-fg:#cfe3df; --nav-active:#ffffff;
  --font-ui:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --font-num:"IBM Plex Sans","Noto Sans SC",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1514; --panel:#161e1d; --fg:#e4ecea; --muted:#94a5a2; --line:#26322f; --line-strong:#34423f;
  --accent:#5cc2b6; --accent-soft:#1a3330; --head:#1b2523; --total:#2b2614; --total-fg:#ecd69b;
  --ok:#5fcf86; --warn:#e7a84b; --nav:#0b1110; --nav-fg:#9fb7b2; --nav-active:#ffffff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1514; --panel:#161e1d; --fg:#e4ecea; --muted:#94a5a2; --line:#26322f; --line-strong:#34423f;
  --accent:#5cc2b6; --accent-soft:#1a3330; --head:#1b2523; --total:#2b2614; --total-fg:#ecd69b;
  --ok:#5fcf86; --warn:#e7a84b; --nav:#0b1110; --nav-fg:#9fb7b2; --nav-active:#ffffff; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:14px;line-height:1.5}
.top{background:var(--nav);color:var(--nav-fg);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.top b{color:var(--nav-active);font-weight:700;letter-spacing:.02em}
.top .crumb{font-size:13px}
.top .tag{margin-left:auto;font-size:12px;border:1px solid currentColor;border-radius:4px;padding:1px 8px;opacity:.85}
.shell{display:grid;grid-template-columns:200px minmax(0,1fr);min-height:calc(100vh - 44px)}
nav.side{background:var(--panel);border-right:1px solid var(--line);padding:16px 10px;display:flex;flex-direction:column;gap:2px}
nav.side .grp{font-size:12px;color:var(--muted);letter-spacing:.08em;padding:4px 10px 8px}
nav.side a{display:flex;gap:8px;align-items:baseline;padding:8px 10px;border-radius:6px;color:var(--fg);text-decoration:none}
nav.side a span{font-family:var(--font-num);font-size:12px;color:var(--muted);width:22px}
nav.side a:hover{background:var(--head)}
nav.side a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:500}
nav.side a[aria-current="page"] span{color:var(--accent)}
main{padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px;min-width:0}
h1{font-size:20px;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:2px 0 0;font-size:13px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:end;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px}
.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
select,button{font:inherit;font-size:13px;color:var(--fg)}
select{background:var(--panel);border:1px solid var(--line-strong);border-radius:6px;padding:6px 8px;min-width:140px}
.spacer{flex:1}
.btn{border:1px solid var(--line-strong);background:var(--panel);border-radius:6px;padding:6px 12px;cursor:pointer}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.btn.primary:hover{opacity:.9;color:var(--panel)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chips .lbl{font-size:12px;color:var(--muted);margin-right:4px}
.chip{border:1px solid var(--line-strong);border-radius:999px;padding:2px 10px;font-size:12px;background:var(--panel);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.sync{display:flex;flex-wrap:wrap;gap:12px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--panel);font-size:13px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block;margin-right:6px}
.sync .muted{color:var(--muted)}
.tablewrap{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
table{border-collapse:separate;border-spacing:0;font-family:var(--font-num);font-variant-numeric:tabular-nums;font-size:13px;white-space:nowrap}
th,td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:6px 10px}
thead th{background:var(--head);font-family:var(--font-ui);font-weight:500;position:sticky;z-index:2;text-align:center}
thead tr:first-child th{top:0;height:22px;padding:2px 10px;font-size:11px;color:var(--muted);font-weight:400}
thead tr:nth-child(2) th{top:27px}
thead tr:nth-child(3) th{top:60px;font-weight:400;color:var(--muted)}
th.g{font-weight:700;color:var(--fg)}
td{text-align:right}
td:first-child,th.stick{position:sticky;left:0;z-index:1;background:var(--panel);text-align:left}
thead th.stick{z-index:3;background:var(--head)}
tr.total td{background:var(--total);color:var(--total-fg);font-weight:600;position:sticky;bottom:0}
tr.total td:first-child{background:var(--total)}
td.dash{color:var(--muted)}
tbody tr:hover td{background:var(--accent-soft)}
.i{border:0;background:none;color:var(--muted);cursor:help;padding:0 0 0 3px;font-size:12px;line-height:1}
.i:hover,.i:focus-visible{color:var(--accent)}
.pop{position:fixed;z-index:20;max-width:300px;background:var(--fg);color:var(--bg);border-radius:8px;padding:10px 12px;font-size:12.5px;line-height:1.55;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.pop b{display:block;font-size:13px;margin-bottom:2px}
.pop code{font-family:var(--font-num);opacity:.85;display:block;margin-top:4px}
.note{font-size:12px;color:var(--muted)}
.gloss{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:12px}
.gloss h2{font-size:16px;margin:0}
.gl{overflow-x:auto}
.gl table{font-family:var(--font-ui);white-space:normal;width:100%;font-variant-numeric:normal}
.gl th,.gl td{text-align:left;vertical-align:top;border-right:0}
.gl th{background:var(--head);font-weight:500;position:static}
.gl td:first-child{position:static;white-space:nowrap;font-weight:500;background:none}
.gl td.f{font-family:var(--font-num);color:var(--muted);white-space:nowrap}
.gl tr:hover td{background:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:6px;font-size:13px;z-index:30}
@media (max-width:760px){
  .shell{grid-template-columns:1fr}
  nav.side{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px 16px}
  nav.side .grp{display:none}
  nav.side a{white-space:nowrap}
  .tablewrap{max-height:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

const ACT_DESC = {101:"次日 00:30 按前一天有效投注的 1.5% 发放",102:"被邀请人达成条件后给邀请人的奖励",103:"额外存款奖励",104:"新用户首充后的转盘奖励",105:"老用户充值后的转盘奖励",106:"VIP 等级提升时发放",107:"每日存款加送 10%",108:"次日按前一天净亏损发放"};
const H_OPS = [
 ["用户数据",["online","registers","reg_fd_users","fd_total_users","reg_fd_rate","fd_rate"]],
 ["代理数据",["agent_reg","agent_reg_rate","agent_dep","agent_dep_rate","agent_comm"]],
 ["充值数据",["dep_users","dep_amount","dep_avg","dep_count","dep_count_avg","fd_amount","fd_avg","fdu_dep","fdu_avg"]],
 ["提款数据",["wd_users","wd_amount","wd_avg","wd_count","wd_count_avg"]],
 ["充提汇总",["net","net_rate"]],
 ["下注数据",["bettors","valid_bet","bet_multiple","kill_rate","ggr"]],
 ["活动奖金数据",["promo_amount","promo_ratio"]]
];
const OPS = r => H_OPS.map(([n,ks])=>[n,ks.filter(k=>R[r].daily?k!=="online":!k.startsWith("agent_"))]).filter(x=>x[1].length);
const FMT = k => /rate|ratio/.test(k)?"pct":/multiple|count_avg/.test(k)?"x":/amount|avg|net$|dep$|bet$|ggr|comm/.test(k)&&!/users|count$/.test(k)?"money":"int";
const R = {
 r1:{t:"每小时数据",d:"每小时一行，30 列（A–AD）。HH:05 统计上一完整小时；「当日」开头的字段从 00:00 累计到该小时。",daily:false,bonus:false},
 r2:{t:"每日数据",d:"每天一行，34 列（A–AH）。完整自然日，人数全天去重，比例用全天分子分母重算。",daily:true,bonus:false},
 r3:{t:"每小时活动奖金",d:"每小时一行，21 列（A–U）。按后台活动编号对应列，出现新编号自动加列。",daily:false,bonus:true},
 r4:{t:"每日活动奖金",d:"每天一行，21 列（A–U）。各活动全天去重，不累加小时人数。",daily:true,bonus:true}
};
const $ = s => document.querySelector(s);
let cur = "r1", hidden = new Set();
function fmt(v,k){
  if(v===null||v===undefined) return ["",true];
  if(typeof v==="string") return [v,false];
  const f=FMT(k);
  if(f==="pct") return [(v*100).toFixed(2)+"%",false];
  if(f==="x") return [v.toFixed(2),false];
  if(f==="money") return [v.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}),false];
  return [v.toLocaleString("en-US"),false];
}
function groupsFor(r,all){
  const g=[["统计时间",["time"]]];
  if(R[r].bonus){
    DATA.acts.forEach(a=>g.push([a.name,[`a${a.id}_users`,`a${a.id}_amount`],a.id]));
    g.push(["总计",["total_times","total_amount"]]);
    g.push(["充值金额",["b_dep"]]);
    g.push(["活动费用占比",["total_ratio"]]);
  } else OPS(r).forEach(x=>g.push(x));
  return all?g:g.filter(x=>!hidden.has(x[0]));
}
function info(k,r){
  let m=k.match(/^a(\d+)_(users|amount)$/);
  if(m){const a=DATA.acts.find(x=>x.id==m[1]);const b=F["act_"+m[2]];return [a.name+" · "+b[0],b[1]+(m[2]==="users"?"（活动编号 "+a.id+"："+ACT_DESC[a.id]+"）":""),b[2]];}
  if(k==="time") return [R[r].daily?"日期":"日期 / 小时",F.time[1],""];
  return F[k];
}
function sub(k){
  if(k==="time") return R[cur].daily?"日期":"日期 / 小时";
  let m=k.match(/^a\d+_(users|amount)$/); if(m) return {users:"参与人数",amount:"活动费用"}[m[1]];
  return (F[k]||[""])[0];
}
function rows(){
  const r=R[cur];
  if(!r.daily){const d=$("#day").value;return (r.bonus?DATA.h_bon:DATA.h_ops).filter(x=>x.time.startsWith(d));}
  let list=r.bonus?DATA.d_bon:DATA.d_ops;
  if($("#range").value==="last2") list=list.slice(-2);
  return list;
}
function render(){
  const r=R[cur];
  $("#ttl").textContent=r.t; $("#desc").textContent=r.d; $("#crumb").textContent=r.t;
  $("#f-day").hidden=r.daily; $("#f-range").hidden=!r.daily;
  document.querySelectorAll("nav.side a").forEach(a=>a.setAttribute("aria-current",a.dataset.r===cur?"page":"false"));
  const g=groupsFor(cur);
  let h0="<tr>",h1="<tr>",h2="<tr>";
  const allKeys=groupsFor(cur,true).flatMap(x=>x[1]);
  const L=i=>{let s="";i++;while(i>0){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26);}return s;};
  g.forEach(([n,ks],gi)=>{
    const stick=gi===0?" stick":"";
    h1+=`<th colspan="${ks.length}" class="g${stick}">${n}</th>`;
    ks.forEach(k=>{const lb=sub(k);h0+=`<th class="col${stick}">${L(allKeys.indexOf(k))}</th>`;h2+=`<th class="${stick.trim()}">${lb}<button class="i" type="button" data-k="${k}" aria-label="${n}${lb}说明">ⓘ</button></th>`});
  });
  let body="";
  rows().forEach(x=>{body+="<tr>"+g.flatMap(([,ks])=>ks).map((k,i)=>{const[v,d]=fmt(x[k],k);return `<td${i===0?' class="stick"':(d?' class="dash"':"")}>${v}</td>`}).join("")+"</tr>"});
  $("#tbl").innerHTML=`<thead>${h0}</tr>${h1}</tr>${h2}</tr></thead><tbody>${body}</tbody>`;
  renderChips(); renderGloss();
}
function renderChips(){
  const base=R[cur].bonus?[...DATA.acts.map(a=>a.name),"总计","充值金额","活动费用占比"]:OPS(cur).map(x=>x[0]);
  $("#chips").innerHTML='<span class="lbl">显示列：</span>'+base.map(n=>`<button type="button" class="chip" aria-pressed="${!hidden.has(n)}" data-g="${n}">${n}</button>`).join("");
}
function renderGloss(){
  let html="<table><thead><tr><th>字段</th><th>口径</th><th>公式</th></tr></thead><tbody>";
  const row=([a,b,c])=>`<tr><td>${a}</td><td>${b}</td><td class="f">${c}</td></tr>`;
  if(R[cur].bonus){
    html+=row(info("time",cur));
    ["act_users","act_amount"].forEach(k=>html+=row(F[k]));
    html+=row(["总计 · 参与人次",F.total_times[1],""])+row(["总计 · 活动费用",F.total_amount[1],""])+row(["充值金额 · 成功充值金额",F.b_dep[1],""])+row(["活动费用占比",F.total_ratio[1],F.total_ratio[2]]);
    DATA.acts.forEach(a=>html+=`<tr><td>${a.name}</td><td>活动编号 ${a.id}（示例）：${ACT_DESC[a.id]}</td><td class="f"></td></tr>`);
  } else {
    html+=row(info("time",cur));
    OPS(cur).flatMap(x=>x[1]).forEach(k=>html+=row(F[k]));
  }
  $("#gloss").innerHTML=html+"</tbody></table>";
}
const pop=$("#pop");
function showPop(btn){
  const [n,d,f]=info(btn.dataset.k,cur);
  pop.innerHTML=`<b>${n}</b>${d||""}${f?`<code>${f}</code>`:""}`;
  pop.hidden=false;
  const b=btn.getBoundingClientRect(), w=Math.min(300,innerWidth-24);
  pop.style.left=Math.max(12,Math.min(b.left-20,innerWidth-w-12))+"px";
  pop.style.top=(b.bottom+8)+"px";
}
document.addEventListener("mouseover",e=>{const b=e.target.closest(".i");if(b)showPop(b);});
document.addEventListener("mouseout",e=>{if(e.target.closest(".i"))pop.hidden=true;});
document.addEventListener("click",e=>{
  const b=e.target.closest(".i"); if(b){showPop(b);e.stopPropagation();return;}
  pop.hidden=true;
  const c=e.target.closest(".chip"); if(c){const g=c.dataset.g;hidden.has(g)?hidden.delete(g):hidden.add(g);render();}
});
$(".tablewrap").addEventListener("scroll",()=>pop.hidden=true);
function toast(t){const el=$("#toast");el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2200);}
$("#b-export").onclick=()=>toast("已生成导出文件（原型演示）");
$("#b-recalc").onclick=()=>toast("已提交重算任务（原型演示）");
$("#b-sync").onclick=()=>toast("已同步到 Google 表格（原型演示）");
["#day","#range","#site"].forEach(s=>$(s).onchange=render);
const days=[...new Set(DATA.h_ops.map(x=>x.time.slice(0,5)))];
$("#day").innerHTML=days.map(d=>`<option value="${d}">2026-${d}</option>`).join("");
$("#day").value=days[days.length-2]||days[0];
function route(){const h=location.hash.slice(1);cur=R[h]?h:"r1";hidden.clear();render();$(".tablewrap").scrollLeft=0;}
addEventListener("hashchange",route); route();
