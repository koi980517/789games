const TODAY="2026-11-16", NOWH=14; // 现在 14:20：已出到 13:00–14:00
const D0=Date.UTC(2026,10,1);

function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=rng(789);
const HF=[.5,.35,.25,.2,.2,.25,.35,.5,.7,.85,.9,.95,1,1,1,1.05,1.1,1.2,1.35,1.5,1.6,1.5,1.2,.8];

const POOL=400; let nextUid=POOL; const firstDep={}; // uid -> 首充时间
const EV=[]; // 每天每小时的事件
for(let d=0;d<NDAYS;d++){EV[d]=[];const lastH=d===NDAYS-1?NOWH-1:23;

  const e={reg:[],login:new Set(),bet:{},dep:[],wd:[],act:[],online:0,payout:0,fdAgentU:new Set()};
  if(h<=lastH){
   const f=HF[h]*(0.75+0.5*R());
   const nReg=Math.round(4*f*R()+f);
   for(let i=0;i<nReg;i++){const u=nextUid++;e.reg.push(u);e.login.add(u)}
   const pick=()=>Math.floor(R()*POOL);
   const nLog=Math.round(30*f);for(let i=0;i<nLog;i++)e.login.add(pick());
   const nBet=Math.round(22*f);for(let i=0;i<nBet;i++){const u=pick();e.login.add(u);e.bet[u]=(e.bet[u]||0)+Math.round(200+R()*1800)}
   const nDep=Math.round(9*f+R()*3);
   for(let i=0;i<nDep;i++){const u=R()<.35&&e.reg.length?e.reg[Math.floor(R()*e.reg.length)]:(R()<.3&&nextUid>POOL?POOL+Math.floor(R()*(nextUid-POOL)):pick());
     e.login.add(u);e.dep.push({u,amt:[100,200,300,500,1000,2000,5000][Math.floor(R()*7)]});}
   const nWd=Math.round(4*f*R());for(let i=0;i<nWd;i++){const u=pick();e.wd.push({u,amt:[200,500,800,1000,1500,3000][Math.floor(R()*6)]})}
   const nAct=Math.round(10*f);for(let i=0;i<nAct;i++){const a=Math.floor(R()*ACTS.length);const u=pick();e.act.push({a,u,amt:Math.round((5+R()*120)*100)/100})}
   e.online=Math.round(8+40*f*R());
  }
  EV[d][h]=e;}}
// 首充识别：全生命周期第一笔
for(let u=0;u<POOL;u++)if(u%9)firstDep[u]=[-1]; // 老用户：11 月前已首充
for(let d=0;d<NDAYS;d++)for(let h=0;h<24;h++)EV[d][h].dep.forEach((x,i)=>{if(!(x.u in firstDep)){firstDep[x.u]=[d,h,i];x.first=true}});
function agg(d,h1,h2){ // 汇总 d 天 [h1,h2] 小时，人数在区间内去重
 const S={log:new Set(),bet:new Set(),dep:new Set(),wd:new Set(),fd:new Set()},o={registers:0,fdAmount:0,depAmount:0,depCount:0,wdAmount:0,wdCountB:0,validBet:0,ggr:0,promoAmount:0,acts:{},online:0};
 const au={};
 for(let h=h1;h<=h2;h++){const e=EV[d][h];o.registers+=e.reg.length;e.login.forEach(u=>S.log.add(u));Object.keys(e.bet).forEach(u=>{S.bet.add(u);o.validBet+=e.bet[u]});
  e.dep.forEach(x=>{S.dep.add(x.u);o.depAmount+=x.amt;o.depCount++;if(x.first){S.fd.add(x.u);o.fdAmount+=x.amt}});

  o.online=e.online;}
 for(const a in au)o.acts[a].users=au[a].size;
 o.ggr=Math.round(o.validBet*(0.02+0.06*((d*7+h1)%5)/5));
 o.bettors=S.bet.size;o.depUsers=S.dep.size;o.wdUsers=S.wd.size;o.fdUsers=S.fd.size;o.loginUsers=S.log.size;o._fdSet=S.fd;o._depSet=S.dep;
 return o;}
function dayFdt(d,hEnd){ // 当日首充总额：0 点到 hEnd 首充的人，当天到 hEnd 的全部充值
 const fd=new Set();let amt=0;for(let h=0;h<=hEnd;h++)EV[d][h].dep.forEach(x=>{if(x.first)fd.add(x.u)});
 for(let h=0;h<=hEnd;h++)EV[d][h].dep.forEach(x=>{if(fd.has(x.u))amt+=x.amt});return{u:fd.size,a:amt};}
// ggr 要可加：按小时生成后相加
const GGRH=[];for(let d=0;d<NDAYS;d++){GGRH[d]=[];for(let h=0;h<24;h++){const b=Object.values(EV[d][h].bet).reduce((s,x)=>s+x,0);GGRH[d][h]=Math.round(b*(-0.04+0.14*R()))}}

function rowFrom(o,d,hEnd,regCum){
 const r={};["online","bettors","registers","fdUsers","fdAmount","depAmount","depCount","depUsers","wdUsers","wdAmount","wdCountB","validBet","promoAmount"].forEach(k=>r[k]=o[k]);
 r.ggr=o.ggr;
 const fdt=dayFdt(d,hEnd);r.fdtUsers=fdt.u;r.fdtAmount=fdt.a;r.fdtAvg=div(fdt.a,fdt.u);
 r.convRate=div(fdt.u,regCum);
 r.fdAvg=div(r.fdAmount,r.fdUsers);r.depAvg=div(r.depAmount,r.depUsers);r.depDailyAvg=null;r.wdAvg=div(r.wdAmount,r.wdUsers);
 r.net=r.depAmount-r.wdAmount;r.netRate=div(r.net,r.depAmount);
 r.retUsers=r.depUsers-r.fdUsers;r.retAmount=r.depAmount-r.fdAmount;r.retAvg=div(r.retAmount,r.retUsers);r.retRatio=div(r.retUsers,r.depUsers);
 r.depCountAvg=div(r.depCount,r.depUsers);r.betMultiple=div(r.validBet,r.depAmount);r.killRate=div(r.ggr,r.validBet);r.promoRatio=div(r.promoAmount,r.depAmount);
 return r;}
function lastDone(d){return d===NDAYS-1?NOWH-1:23}
function hourRow(d,h,cum){
 if(h>lastDone(d))return {time:cum?(dstr(d).slice(5)+" 0-"+(h+1)):(dstr(d).slice(5)+" "+pad(h)+":00"),_empty:true,_h:h,_d:d};
 const o=agg(d,cum?0:h,h);o.ggr=GGRH[d].slice(cum?0:h,h+1).reduce((s,x)=>s+x,0);
 if(cum)o.online=o.loginUsers;
 let regCum=0;for(let k=0;k<=h;k++)regCum+=EV[d][k].reg.length;
 const r=rowFrom(o,d,h,regCum);r.time=cum?(dstr(d).slice(5)+" 0-"+(h+1)):(dstr(d).slice(5)+" "+pad(h)+":00");r._acts=o.acts;r._h=h;r._d=d;return r;}
function dayRow(d){
 const o=agg(d,0,23);o.ggr=GGRH[d].reduce((s,x)=>s+x,0);o.online=o.loginUsers;
 const r=rowFrom(o,d,23,o.registers);r.time=dstr(d);r.weekday="周"+"日一二三四五六"[new Date(D0+d*864e5).getUTCDay()];

  <span class="grp">${qs.map(([k,l])=>`<button class="btn ${quick===k?"on":""}" data-q="${k}">${l}</button>`).join("")}</span>
  <button class="btn pri" id="b-search">⌕ 搜索</button><button class="btn" id="b-refresh">↻ 刷新</button><button class="btn" id="b-export">⇩ 导出</button>`;}
function renderUpd(){const [u,t]=updInfo(cur);$("#upd").innerHTML=`<span>数据更新时间：${u}</span><span>已更新到：${t}</span><span>${cur.sync}</span><span class="m">点「刷新」重新查询最新数据</span>`}
function th(k,label,g,stk,rs){const tip=`<button class="i" type="button" data-k="${k}" aria-label="${g}${label}说明">ⓘ</button>`;return`<th class="${stk?"stk":""}"${rs?' rowspan="2"':""}>${label||g}${tip}</th>`}
function renderTable(){
 if(cur.kind==="top")return renderTop();
 const list=rows(),G=groups(list).filter(([g])=>!hidden.has(g)||g==="时间"||g==="日期");
 $("#chips").innerHTML="显示列："+groups(list).slice(1).filter(([g])=>g!=="星期"||true).map(([g])=>`<button class="chip ${hidden.has(g)?"off":""}" data-g="${g}">${g}</button>`).join("");
 let h1="<tr>",h2="<tr>";
 G.forEach(([g,ks],gi)=>{if(ks.length===1&&!ks[0][1])h1+=th(ks[0][0],"",g,gi===0,true);else{h1+=`<th colspan="${ks.length}">${g}</th>`;ks.forEach(([k,l])=>h2+=th(k,l,g,false,false))}});
 const keys=G.flatMap(x=>x[1].map(y=>y[0]));
 let body="";
 if(!list.length)body=`<tr><td class="empty" colspan="${keys.length}">No Data</td></tr>`;
 list.forEach((r,i)=>{const cls=[];if(cur.cum&&r._h===0&&i>0)cls.push("day0");if(cur.cum&&r._h===23&&!r._empty)cls.push("last");
  body+=`<tr class="${cls.join(" ")}">`+keys.map(k=>`<td class="${k==="time"||k==="weekday"?"l":""}">${cell(r,k)}</td>`).join("")+"</tr>"});
 if(cur.daily&&list.length){const t=totalRow(list);body+=`<tr class="tot">`+keys.map(k=>`<td class="${k==="time"?"l":""}">${k==="time"?"合计":cell(t,k)}</td>`).join("")+"</tr>"}
 $("#tbl").innerHTML=`<thead>${h1}</tr>${h2}</tr></thead><tbody>${body}</tbody>`;}
function renderTop(){
 $("#chips").innerHTML="";
 const d=didx(topDate),agg2={};
 if(d>=0&&d<NDAYS-1)for(let h=0;h<24;h++){const e=EV[d][h];e.dep.forEach(x=>{const a=agg2[x.u]=agg2[x.u]||{dep:0,wd:0,vb:0};a.dep+=x.amt});e.wd.forEach(x=>{const a=agg2[x.u]=agg2[x.u]||{dep:0,wd:0,vb:0};a.wd+=x.amt});Object.keys(e.bet).forEach(u=>{const a=agg2[u]=agg2[u]||{dep:0,wd:0,vb:0};a.vb+=e.bet[u]})}
 const acct=u=>"u"+(Number(u)*7919%100000).toString(36).padStart(5,"0");
 const list=Object.entries(agg2).filter(([u,a])=>board==="deposit"?a.dep>0:a.wd>0).map(([u,a])=>({acct:acct(u),attr:1+Number(u)%4,dep:a.dep,wd:a.wd,vb:a.vb,mult:div(a.vb,a.dep),net:a.dep-a.wd,bal:Math.round((Number(u)*37%5000)*100)/100,plat:["h5","ios","安卓","h5,pwa"][Number(u)%4],games:"Super Ace, Fortune Gems, Lucky Coming"}))
  .sort((x,y)=>(board==="deposit"?y.dep-x.dep:y.wd-x.wd)||x.acct.localeCompare(y.acct)).slice(0,50);
 const ATTR={1:"短信",2:"自然流量",3:"邀请好友",4:"广告来源"};
 const head="<tr><th class='stk'>排名</th>"+TOPCOLS.map(([k,l])=>`<th>${l}<button class="i" type="button" data-top="${k}">ⓘ</button></th>`).join("")+"</tr>";
 const f=(v,k)=>k==="attr"?v+" "+ATTR[v]:(["dep","wd","vb","net","bal"].includes(k)?fmt(v,"amount"):k==="mult"?fmt(v,"Multiple"):v);
 const body=list.length?list.map((r,i)=>"<tr><td>"+(i+1)+"</td>"+TOPCOLS.map(([k])=>`<td class="${["acct","plat","games","attr"].includes(k)?"l":""}">${r[k]==null?"":f(r[k],k)}</td>`).join("")+"</tr>").join(""):`<tr><td class="empty" colspan="11">No Data</td></tr>`;
 $("#tbl").innerHTML=`<thead>${head}</thead><tbody>${body}</tbody>`;}
function renderV2Note(){
 $("#v2note").innerHTML=false?`<b>v2.0 新增</b>　0-24 行和「${cur.bonus?"每日彩金":"每日数据"}」同名字段一致；当天只显示已完成的小时，未出数的小时为空行。人数在 00:00 到该小时末去重（同一人多个小时只算 1 次），金额 / 笔数相加，比率和人均用累计值重算。`:"";}
function render(){
 $("#ttl").textContent=cur.title;$("#crumb").textContent=cur.title;$("#desc").textContent=cur.desc;
 renderSide();renderTabs();renderBar();renderUpd();renderV2Note();renderTable();}
function open(k){cur=REPORTS.find(r=>r.key===k)||REPORTS[0];if(!opened.includes(cur.key))opened.push(cur.key);
 if(cur.kind!=="top"){if(cur.daily){range=quickRange("tm");quick="tm"}else{range=[TODAY,TODAY];quick=""}}
 hidden=new Set();render();}
let tt;function toast(s){const e=$("#toast");e.textContent=s;e.hidden=false;clearTimeout(tt);tt=setTimeout(()=>e.hidden=true,2400)}
function checkRange(){let[a,b]=range;if(a>b){[a,b]=[b,a]}const n=didx(b)-didx(a)+1;
 if(n>cur.maxDays){a=dstr(didx(b)-cur.maxDays+1);quick="";toast((cur.daily?"日表":"小时表")+"一次最多 "+cur.maxDays+" 天，已按结束日期往前取")}range=[a,b];}
document.addEventListener("click",e=>{
 const s=e.target.closest("#side a,#tabs span");if(s){e.preventDefault();location.hash=s.dataset.k;return}
 const q=e.target.closest("[data-q]");if(q){quick=q.dataset.q;range=quickRange(quick);checkRange();render();return}
 const c=e.target.closest("[data-g]");if(c){const g=c.dataset.g;hidden.has(g)?hidden.delete(g):hidden.add(g);renderTable();return}
 if(e.target.closest("#b-search")){if(cur.kind==="top"){topDate=$("#td").value;board=$("#board").value}else{range=[$("#d1").value,$("#d2").value];quick="";checkRange()}render();return}
 if(e.target.closest("#b-refresh")){render();toast("已刷新");return}
 if(e.target.closest("#b-export")){toast("已导出 "+cur.title+"（原型不下载文件）");return}
});
const pop=$("#pop");
document.addEventListener("mouseover",e=>{const b=e.target.closest(".i");if(!b){pop.hidden=true;return}
 let t;if(b.dataset.top){const x=TOPCOLS.find(c=>c[0]===b.dataset.top);t=[x[1],x[2],""]}else t=infoOf(b.dataset.k);
 pop.innerHTML="<b>"+t[0]+"</b>"+(t[1]?"<p>"+t[1]+"</p>":"")+(t[2]?"<code>"+t[2]+"</code>":"");
 pop.hidden=false;const r=b.getBoundingClientRect();pop.style.left=Math.min(r.left,innerWidth-310)+"px";pop.style.top=(r.bottom+6)+"px";});
window.addEventListener("hashchange",()=>open(location.hash.slice(1)));
open(location.hash.slice(1)||REPORTS[0].key);
</script>
</body></html>
