<style>
:root{--bg:#f4f6f9;--panel:#fff;--ink:#1f2933;--muted:#6b7785;--line:#e3e7ec;--accent:#1d6cae;--accent-soft:#e8f1fa;--stage:#e9edf2}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;font-size:14px}
header{background:#1d6cae;color:#fff;padding:14px 20px;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline}
header h1{margin:0;font-size:18px}
header span{opacity:.85;font-size:12px}
.wrap{display:flex;flex-wrap:wrap;min-height:calc(100vh - 52px)}
nav{flex:0 0 260px;background:var(--panel);border-right:1px solid var(--line);padding:12px 0}
nav h2{font-size:12px;color:var(--muted);margin:14px 18px 6px;font-weight:600;letter-spacing:.04em}
nav button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 18px;font:inherit;color:var(--ink);cursor:pointer;border-left:3px solid transparent}
nav button:hover{background:var(--bg)}
nav button[aria-current="true"]{background:var(--accent-soft);border-left-color:var(--accent);color:var(--accent);font-weight:600}
nav .tag{display:inline-block;margin-left:6px;font-size:10px;padding:0 5px;border-radius:2px;background:#ff8a00;color:#fff;vertical-align:middle}
main{flex:999 1 560px;min-width:0;padding:16px 20px 32px}
.bar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-bottom:12px}
.bar h3{margin:0;font-size:16px}
.back{border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:5px 10px;font:inherit;font-size:12px;cursor:pointer;color:var(--ink)}.back:disabled{opacity:.4;cursor:default}
.hint{font-size:12px;color:var(--muted);margin:0 0 10px}
.bar .meta{color:var(--muted);font-size:12px}
.bar label{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;margin-left:auto}
.stage{background:var(--stage);border:1px solid var(--line);border-radius:8px;padding:16px;overflow:auto}
.frame-box{margin:0 auto;transform-origin:top left}
iframe{border:0;display:block;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.12)}
.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-top:18px}
.note{background:var(--panel);border:1px solid var(--line);border-top:4px solid #c0c4cc;border-radius:6px;padding:12px 14px;white-space:pre-wrap;line-height:1.6;font-size:12px}
.note.blue{border-top-color:#3d8fd8}.note.orange{border-top-color:#ff8a00}.note.pink{border-top-color:#e85d8c}
@media (max-width:760px){nav{flex-basis:100%;border-right:0;border-bottom:1px solid var(--line)}main{padding:12px}}
</style>
</head>

var NOTES = [{"page": "后台", "text": "现网读取（QA 后台 2026-11-10）老用户充值转盘\n\n• 菜单 活动中心 › 老用户充值转盘，页签：活动配置｜活动统计\n• 列表：活动编号/名称/类型/开始/结束/创建时间/总预算/已使用预算/创建人/状态（开关）/修改\n• 表单：活动展示开关（控制未登录可见）、名称、开始/结束时间、领取方式（手动/自动）、是否需要 KYC、是否需要充值记录、人群范围（充值次数 ≥ N）、充值渠道（PayMongo/Traxion Pay/PayCools/GCASH）、奖池总预算（空=不限）\n• 档位：首次 / 非首次，每档 = 充值区间 + 最多 2 个奖励金额 + 整数概率\n• 已有「白名单奖励档位」+ 白名单导入（CSV 只有 phone 列，需先保存活动）：白名单手机号充值时改走白名单档位，仍要充值才有次数\n• 流水：首次 / 非首次各配倍数，可勾选是否含本金、是否含奖金\n• 奖励弹窗文案（{bonus}）\n• 统计：会员账号 + 领取时间筛选，导出；领取总额；ID/会员ID/会员账号/活动类型/领取金额/日期/领取时间\n• 接口 /api/admin/activity/oldUserRechargeSpin/*，activityType=OLD_USER_RECHARGE_SPIN", "color": "blue"}, {"page": "后台", "text": "本原型的取舍（橙色角标 = 相对现网的改动）\n\n1. 独立菜单「白名单转盘」，activityType 新建（建议 WHITELIST_SPIN），与老用户充值转盘独立配置、独立预算、独立统计\n2. 去掉：人群范围、充值渠道、是否需要充值记录、旧白名单（手机号）导入、流水「含本金」\n3. 转数设置：逐转选「免费 / 付费」。有免费转 → 出现「免费转盘配置」（盘面 10 格金额 + 免费中奖概率，合计 100%）；有付费转 → 出现「付费转盘配置 · 充值配置」，平移老转盘充值配置表（充值记录、人群范围、充值渠道、首次 / 非首次 + 充值区间档位、每档 ≤2 奖励 + 概率、首次 / 非首次流水含本金 / 奖金），奖励金额从盘面 10 格中选\n4. 新增页签「白名单发放」：单个 / 批量（User ID）、次数、次数类型、备注、记录、作废\n5. 次数随活动结束失效；活动关闭时不可抽\n6. 发放时按「次数 × 该类型最高奖」预估，超过剩余预算拦截\n7. 活动列表新增「删除」：仅关闭且无未使用次数可删，软删除，记录保留", "color": "orange"}, {"page": "后台", "text": "待确认\n\n• 大奖格 ₱7,890 是否允许配置大于 0 的概率（目前默认 0，只展示）\n• 免费 / 充值次数是否要不同的有效期或展示文案\n• 预算用完：已发未用次数是不能抽，还是照常发奖\n• 单次 / 单人累计发放上限（原型暂定单次 ≤ 10、批量 ≤ 5,000 行）\n• 是否要求是老用户（充值 ≥1）、冻结 / 风控账号是否拦截\n• 与老用户充值转盘同时有次数时的入口和弹窗优先级\n• 只在 789games 生效还是两站都上", "color": "pink"}, {"page": "前台 H5", "text": "前台规则\n\n• 只有剩余次数 > 0 的白名单用户能看到入口；未登录、非白名单不展示（不复刻老用户转盘的登录前盘面）\n• 发放后首次进入首页弹「获得次数」提示，每个发放批次只弹 1 次；协议弹窗 > 转盘弹窗（-6290）\n• 盘面为 10 格（紫金主题，参考 Super Spin）：10 格金额全部展示（免费格 + 充值格），第 1 格大奖紫底高亮，标题 Jackpot 取 10 格最大值\n• 点 GO → 接口按当前次数类型（免费 / 充值）在该类型的格里按概率返回命中格 index + 金额 → 前端转到该格停下\n• 多条发放记录都有次数时先发先用；底座 Remaining spins = 所有记录剩余之和\n• 接口建议：GET /whitelistSpin/info 返回 slots[10]（金额）、remaining、当前次数类型；POST /whitelistSpin/draw 返回 slotIndex、amount、remaining、grantId\n• 中奖弹窗沿用 DEPOSIT SPIN REWARDS 样式，标题改 LUCKY SPIN REWARDS；关闭弹窗后入账\n• 抽奖接口先扣次数再出结果，防止被打断后不扣（-6250）", "color": "orange"} :00', end: '2026-10-07 23:59:59', created: '2026-09-28 09:41:10', budget: '100,000.00', used: '31,204.50', granted: 820, drawn: 808, unused: 12, creator: 'Koi0930', on: false }\n      ],\n      fName: '', fCreator: '', fStatus: 'all',\n      applied: { name: '', creator: '', status: 'all' },\n      dialog: null, toast: null, toastErr: false\n    };\n  }\n  showToast(msg, err) {\n    this.setState({ toast: msg, toastErr: !!err });\n    clearTimeout(this._tt);\n    this._tt = setTimeout(() => this.setState({ toast: null }), 2600);\n  }\n  renderVals() {\n    const s = this.state, f = s.applied;\n    const list = s.rows.filter((r) =>\n      (!f.name || r.name.indexOf(f.name) >= 0) &&\n      (!f.creator || r.creator.toLowerCase().indexOf(f.creator.toLowerCase()) >= 0) &&\n      (f.status === 'all' || (f.status === 'on') === r.on));\n    const rows = list.map((r, i) => {\n      const canDel = !r.on && r.unused === 0;\n      const reason = r.on ? '活动开启中，请先关闭再删除' : (r.unused > 0 ? '还有 ' + r.unused + ' 次未使用，不可删除（可先到发放页作废）' : '');\n      return Object.assign({}, r, {\n        no: i + 1,\n        unused: r.unused.toLocaleString('en-US'),\n        granted: r.granted.toLocaleString('en-US'),\n        drawn: r.drawn.toLocaleString('en-US'),\n        onText: r.on ? 'true' : 'false',\n        swStyle: 'position:relative;width:40px;height:20px;border-radius:10px;border:0;padding:0;cursor:pointer;background:' + (r.on ? '#13ce66' : '#dcdfe6'),\n        knobStyle: 'position:absolute;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .2s;left:' + (r.on ? '22px' : '2px'),\n        delStyle: canDel ? 'color:#f56c6c' : 'color:#c0c4cc;cursor:not-allowed',\n        delTitle: reason || '删除活动',\n        askToggle: () => this.setState({ dialog: { kind: 'toggle', id: r.id } }),\n        askDelete: () => canDel ? this.setState({ dialog: { kind: 'delete', id: r.id } }) : this.showToast(reason, true)\n      });\n    });\n    const d = s.dialog, dr = d ? s.rows.find((x) => x.id === d.id) : null;\n    let dTitle = '', dBody = '', dSub = '', dOk = '确定', dOkStyle = '';\n    if (dr && d.kind === 'toggle') {\n      dTitle = dr.on ? '关闭活动' : '开启活动';\n      dBody = (dr.on ? '确定关闭该活动吗？' : '确定开启该活动吗？') + '（' + dr.id + ' ' + dr.name + '）';\n      dSub = dr.on ? (dr.unused > 0 ? '关闭后，已发放未使用的 ' + dr.unused + ' 次将不可抽，前台入口隐藏；重新开启后恢复。' : '关闭后前台入口隐藏。') : '开启后，剩余次数 > 0 的白名单用户可在前台看到入口。';\n    } else if (dr && d.kind === 'delete') {\n      dTitle = '删除活动';\n      dBody = '确定删除「' + dr.name + '」吗？';\n      dSub = '删除后列表不再显示；发放记录、抽奖明细、统计和操作日志保留可查。';\n      dOk = '删除'; dOkStyle = 'background:#f56c6c;border-color:#f56c6c';\n    }\n    const confirm = () => {\n      if (!dr) return;\n      if (d.kind === 'toggle') {\n        this.setState({ rows: s.rows.map((x) => (x.id === dr.id ? Object.assign({}, x, { on: !x.on }) : x)), dialog: null });\n        this.showToast(dr.on ? '活动已关闭' : '活动已开启');\n      } else {\n        this.setState({ rows: s.rows.filter((x) => x.id !== dr.id), dialog: null });\n        this.showToast('已删除，可在操作日志中查看');\n      }\n    };\n    return {\n      rows, total: list.length, empty: list.length === 0,\n      fName: s.fName, fCreator: s.fCreator, fStatus: s.fStatus,\n      setName: (e) => this.setState({ fName: e.target.value }),\n      setCreator: (e) => this.setState({ fCreator: e.target.value }),\n      setStatus: (e) => this.setState({ fStatus: e.target.value }),\n      search: () => this.setState({ applied: { name: s.fName.trim(), creator: s.fCreator.trim(), status: s.fStatus } }),\n      reset: () => this.setState({ fName: '', fCreator: '', fStatus: 'all', applied: { name: '', creator: '', status: 'all' } }),\n      hasDialog: !!dr, dTitle, dBody, dSub, dOk, dOkStyle,\n      cancel: () => this.setState({ dialog: null }), confirm,\n      hasToast: !!s.toast, toast: s.toast || '',\n      toastStyle: 'position:absolute;left:50%;top:70px;transform:translateX(-50%);padding:9px 18px;border-radius:4px;font-size:13px;box-shadow:0 4px 12p ass=\"tip\">开启后，剩余次数 &gt; 0 的白名单用户可看到入口；未登录用户一律不展示<\/span><\/span><\/div>\n\n    <div class=\"sec\">基础配置<\/div>\n    <div class=\"row\"><label class=\"lab\" for=\"n\">* 活动名称<\/label><span class=\"ctl\"><input id=\"n\" class=\"inp\" style=\"width:320px\" value=\"12月召回白名单转盘\"><\/span><\/div>\n    <div class=\"row\"><span class=\"lab\">* 活动开始时间<\/span><span class=\"ctl\"><input class=\"inp\" style=\"width:200px\" value=\"2026-12-01 00:00:00\" aria-label=\"活动开始时间\"><span class=\"tip\">GMT+8<\/span><\/span><\/div>\n    <div class=\"row\"><span class=\"lab\">* 活动结束时间<\/span><span class=\"ctl\"><input class=\"inp\" style=\"width:200px\" value=\"2026-12-31 23:59:59\" aria-label=\"活动结束时间\"><span class=\"tip\">活动结束后，未使用的次数自动失效<\/span><\/span><\/div>\n    <div class=\"row\"><span class=\"lab\">领取方式<\/span><span class=\"ctl\"><label><input type=\"radio\" name=\"r\" checked> 手动领取<\/label><label><input type=\"radio\" name=\"r\"> 自动发放<\/label><\/span><\/div>\n    <div class=\"row\"><span class=\"lab\">是否需要KYC<\/span><span class=\"ctl\"><label><input type=\"radio\" name=\"k\"> 是<\/label><label><input type=\"radio\" name=\"k\" checked> 否<\/label><span class=\"tip\">与现网一致<\/span><\/span><\/div>\n    <div class=\"row\"><label class=\"lab\" for=\"b\">奖池总预算额度<\/label><span class=\"ctl\"><input id=\"b\" class=\"inp\" style=\"width:200px\" value=\"300000\"><span class=\"tip\">留空为不限金额；免费转、付费转共用<\/span><\/span><\/div>\n\n    <div class=\"sec\">转数设置<span class=\"new\">新增<\/span><\/div>\n    <div class=\"row\"><span class=\"lab\">每人转数<\/span><span class=\"ctl\" style=\"display:block\">\n      <div class=\"tip\" style=\"margin-bottom:8px\">逐转设置类型。选「免费」→ 下方出现<b style=\"color:#3d8fd8\">免费转盘配置<\/b>；选「付费」→ 下方出现<b style=\"color:#b88230\">付费转盘配置<\/b>（与充值关联，沿用老用户充值转盘的充值配置表）。按顺序转，最多 10 转。<\/div>\n      <div class=\"scroll\"><table class=\"tbl\" style=\"max-width:860px\">\n        <thead><tr><th>转次<\/th><th>类型（可切换）<\/th><th>解锁条件<\/th><th>使用配置<\/th><th>操作<\/th><\/tr><\/thead>\n        <tbody>\n          <sc-for list=\"{{spinRows}}\" as=\"t\" hint-placeholder-count=\"3\">\n            <tr style=\"{{t.rowStyle}}\"><td>第 {{t.no}} 转<\/td>\n              <td><span style=\"display:inline-flex;gap:6px\"><button class=\"btn\" onClick=\"{{t.setFree}}\" style=\"{{t.freeStyle}}\">免费<\/button><button class=\"btn\" onClick=\"{{t.setPaid}}\" style=\"{{t.paidStyle}}\">付费<\/button><\/span><\/td>\n              <td>{{t.unlock}}<\/td><td style=\"{{t.cfgStyle}}\">{{t.cfg}}<\/td>\n              <td><button class=\"btn txt\" onClick=\"{{t.remove}}\" style=\"{{t.delStyle}}\">删除<\/button><\/td><\/tr>\n          <\/sc-for>\n        <\/tbody>\n      <\/table><\/div>\n      <div style=\"display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;margin-top:10px;font-size:12px\">\n        <button class=\"btn\" onClick=\"{{addSpin}}\">+ 新增一转<\/button>\n        <span>每人共 <b>{{spinTotal}}<\/b> 转：免费 {{spinFree}} 转、付费 {{spinPaid}} 转<\/span>\n        <span>单人最高成本 <b>{{spinMaxCost}}<\/b><\/span>\n      <\/div>\n    <\/span><\/div>\n\n    <div class=\"sec\">{{slotTitle}}<\/div>\n    <div class=\"row\"><span class=\"lab\">{{slotLabel}}<\/span><span class=\"ctl\" style=\"display:block\">\n      <div class=\"panel free\">\n        <div class=\"tip\" style=\"margin-bottom:8px;line-height:1.7\">前台转盘固定 10 格，顺时针从顶部开始，第 1 格为大奖格。这里的金额就是前台盘面显示的金额；付费档位的奖励金额只能从这 10 格中选，转盘才能停在对应格。<sc-if value=\"{{hasFree}}\" hint-placeholder-val=\"{{true}}\"><b>免费转只按「免费中奖概率」抽（合计 100%，0 = 免费转抽不到）。<\/b><\/sc-if><\/div>\n        <div class=\"scroll\"><table class=\"tbl\">\n          <thead><tr><th>格（盘面位置）<\/th><th>金额（₱）<\/th><sc-if value=\"{{hasFree}}\" hint-placeholder-val=\"{{true}}\"><th>免费中奖概率（%）<\/th><th>免费期望成本 / 次<\/th><\/sc-if><th>被付费档位引用<\/th><\/tr><\/thead>\n          <tbody>\n            <sc-for list=\"{{slotRows}}\" as=\"r\" hint-placeholder-count=\"10\">\n              <tr><td>{{r.no}}<span class=\"tip\"> {{r.pos}}<\/span><\/td>\n                <td><input class=\"inp\" style=\"width:90px\" value=\"{{r.amount}}\" onChange=\"{{r.onAmount}}\" aria-label=\"金额\"><\/td>\n                <sc-if value=\"{{hasFree}}\" hint-placeholder-val=\"{{true}}\"><td><input class=\"inp\" style=\"width:64px\" value=\"{{r.prob}}\" onChange=\"{{r.onProb}}\" aria-label=\"免费中奖概率\"> %<\/td><td>{{r.cost}}<\/td><\/sc-if>\n                <td class=\"tip\">{{r.usedBy}}<\/td><\/tr>\n            <\/sc-for>\n          <\/tbody>\n        <\/table><\/div>\n        <sc-if value=\"{{hasFree}}\" hint-placeholder-val=\"{{true}}\">\n          <div style=\"display:flex;flex-wrap:wrap;gap:8px 28px;margin-top:10px;font-size:12px\"><span>免费概率合计：<b style=\"{{fSumStyle}}\">{{fSum}}%<\/b><\/span><span>免费转期望 <b>{{fExp}}<\/b> / 次 · 最高 {{fMax}}<\/span><\/div>\n          <div class=\"row\" style=\"margin-top:6px\"><span class=\"tip\" style=\"width:180px\">免费转彩金提现所需流水倍数<\/span><input class=\"inp\" style=\"width:80px\" value=\"1\" aria-label=\"免费流水倍数\"> 倍 <span class=\"tip\" style=\"margin-left:16px\">稽核是否包含奖金<\/span><label><input type=\"radio\" name=\"fb\" checked> 是<\/label><label><input type=\"radio\" name=\"fb\"> 否<\/label><\/div>\n        <\/sc-if>\n      <\/div>\n    <\/span><\/div>\n\n    <sc-if value=\"{{hasPaid}}\" hint-placeholder-val=\"{{true}}\">\n      <div class=\"sec\">付费转盘配置 · 充值配置<span class=\"new\">平移自老用户充值转盘<\/span><span class=\"tip\" style=\"font-weight:400;margin-left:10px\">第 {{paidSpinNos}} 转使用<\/span><\/div>\n      <div class=\"row\"><span class=\"lab\"><\/span><span class=\"ctl\"><span class=\"tip\">付费转需用户完成充值才解锁：充值到账后按「首次 / 非首次 + 充值金额」匹配下表档位，按该档位的奖励和概率抽奖。一笔充值解锁 1 个付费转。<\/span><\/span><\/div>\n      <div class=\"row\"><span class=\"lab\">是否需要有过充值记录<\/span><span class=\"ctl\"><label><input type=\"radio\" name=\"hr\"> 是<\/label><label><input type=\"radio\" name=\"hr\" checked> 否<\/label><\/span><\/div>\n      <div class=\"row\"><span class=\"lab\">人群范围<\/span><span class=\"ctl\">用户充值次数<select class=\"inp\" style=\"width:70px\" value=\"{{rcRel}}\" onChange=\"{{setRcRel}}\"><option value=\"gte\">≥<\/option><option value=\"eq\">=<\/option><option value=\"lte\">≤<\/option><\/select><input class=\"inp\" style=\"width:70px\" value=\"{{rcCount}}\" onChange=\"{{setRcCount}}\" aria-label=\"充值次数\"> 次<\/span><\/div>\n      <div class=\"row\"><span class=\"lab\">充值渠道<\/span><span class=\"ctl\">充值方式\n        <sc-for list=\"{{channels}}\" as=\"c\" hint-placeholder-count=\"4\"><label style=\"display:inline-flex;gap:4px;align-items:center\"><input type=\"checkbox\" checked=\"{{c.on}}\" onChange=\"{{c.toggle}}\"> {{c.name}}<\/label><\/sc-for><\/span><\/div>\n      <div class=\"row\"><span class=\"lab\">奖励档位<\/span><span class=\"ctl\" style=\"display:block\">\n        <div class=\"panel paid\">\n          <div class=\"tip\" style=\"margin-bottom:8px\">沿用老转盘结构：每档 = 首次 / 非首次 + 充值金额区间 + 最多 2 个奖励（金额从盘面 10 格中选）+ 整数概率（合计 100%）。最大值留空 = 无穷大。<\/div>\n          <sc-for list=\"{{tierRows}}\" as=\"t\" hint-placeholder-count=\"6\">\n            <div style=\"display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;padding:6px 0;border-bottom:1px dashed #ebeef5\">\n              <select class=\"inp\" style=\"width:84px\" value=\"{{t.kind}}\" onChange=\"{{t.setKind}}\" aria-label=\"首次或非首次\"><option value=\"F\">首次<\/option><option value=\"N\">非首次<\/option><\/select>\n              <input class=\"inp\" style=\"width:84px\" placeholder=\"最小值\" value=\"{{t.min}}\" onChange=\"{{t.setMin}}\" aria-label=\"最小充值\"> — <input class=\"inp\" style=\"width:110px\" placeholder=\"最大值(无穷大时不填)\" value=\"{{t.max}}\" onChange=\"{{t.setMax}}\" aria-label=\"最大充值\">\n              <span style=\"margin-left:8px\">奖励金额1<\/span><select class=\"inp\" style=\"width:130px\" value=\"{{t.a1}}\" onChange=\"{{t.setA1}}\" aria-label=\"奖励金额1\"><sc-for list=\"{{slotOpts}}\" as=\"o\" hint-placeholder-count=\"10\"><option value=\"{{o.v}}\">{{o.label}}<\/option><\/sc-for><\/select>\n              <span>中奖概率<\/span><input class=\"inp\" style=\"width:56px\" value=\"{{t.p1}}\" onChange=\"{{t.setP1}}\" aria-label=\"概率1\">%\n              <span style=\"margin-left:8px\">奖励金额2<\/span><select class=\"inp\" style=\"width:130px\" value=\"{{t.a2}}\" onChange=\"{{t.setA2}}\" aria-label=\"奖励金额2\"><option value=\"\">不设<\/option><sc-for list=\"{{slotOpts}}\" as=\"o\" hint-placeholder-count=\"10\"><option value=\"{{o.v}}\">{{o.label}}<\/option><\/sc-for><\/select>\n              <span>中奖概率<\/span><input class=\"inp\" style=\"width:56px\" value=\"{{t.p2}}\" onChange=\"{{t.setP2}}\" aria-label=\"概率2\">%\n              <button class=\"btn txt\" onClick=\"{{t.add}}\">新增<\/button><button class=\"btn txt\" onClick=\"{{t.remove}}\" style=\"color:#f56c6c\">—<\/button>\n              <span style=\"{{t.chkStyle}}\">{{t.chk}}<\/span>\n            <\/div>\n          <\/sc-for>\n        <\/div>\n      <\/span><\/div>\n      <div class=\"row\"><label class=\"lab\">首次彩金提现所需流水倍数<\/label><span class=\"ctl\"><input class=\"inp\" style=\"width:100px\" value=\"2\" aria-label=\"首次流水倍数\"> 倍<\/span><\/div>\n      <div class=\"row\"><span class=\"lab\">首次提现稽核流水是否包含本金（充值金额）<\/span><span class=\"ctl\"><label><input type=\"radio\" name=\"fp\"> 是<\/label><label><input type=\"radio\" name=\"fp\" checked> 否<\/label><\/span><\/div>\n      <div class=\"row\"><span class=\"lab\">首次提现稽核流水是否包含奖金（奖励金额）<\/span><span class=\"ctl\"><label><input type=\"radio\" name=\"fbb\" checked> 是<\/label><label><input type=\"radio\" name=\"fbb\"> 否<\/label><\/span><\/div>\n      <div class=\"row\"><label class=\"lab\">非首次彩金提现所需流水倍数<\/label><span class=\"ctl\"><input class=\"inp\" style=\"width:100px\" value=\"3\" aria-label=\"非首次流水倍数\"> 倍<\/span><\/div>\n      <div class=\"row\"><span class=\"lab\">非首次提现稽核流水是否包含本金（充值金额）<\/span><span class=\"ctl\"><label><input type=\"radio\" name=\"np\"> 是<\/label><label><input type=\"radio\" name=\"np\" checked> 否<\/label><\/span><\/div>\n      <div class=\"row\"><span class=\"lab\">非首次提现稽核流水是否包含奖金（奖励金额）<\/span><span class=\"ctl\"><label><input type=\"radio\" name=\"nbb\" checked> 是<\/label><label><input type=\"radio\" name=\"nbb\"> 否<\/label><\/span><\/div>\n    <\/sc-if>\n\n    <div class=\"sec\">活动文案配置<\/div>\n    <div class=\"row\"><span class=\"lab\"><label><input type=\"checkbox\" checked> 奖励弹窗文案<\/label><\/span><span class=\"ctl\"><input class=\"inp\" style=\"width:420px\" value=\"Get ₱ {bonus} From Lucky Spin\" aria-label=\"奖励弹窗文案\"><span class=\"tip\">支持 {bonus}<\/span><\/span><\/div>\n    <div class=\"row\"><label class=\"lab\" for=\"g\">获得次数提示文案<\/label><span class=\"ctl\"><input id=\"g\" class=\"inp\" style=\"width:420px\" value=\"You've got {count} Lucky Spins! Spin now to win up to ₱{max}\"><span class=\"tip\">支持 {count} {max}；为空则不弹<\/span><\/span><\/div>\n\n    <div style=\"display:flex;justify-content:center;gap:12px;margin-top:28px\"><a class=\"btn\" href=\"Main.dc.html\">取消<\/a><button class=\"btn pri\" onClick=\"{{save}}\">保存<\/button><\/div>\n  <\/div>\n\n  <sc-if value=\"{{hasDialog}}\" hint-placeholder-val=\"{{false}}\">\n    <div style=\"position:absolute;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:flex-start;justify-content:center;padding-top:700px\">\n      <div role=\"dialog\" aria-label=\"{{dTitle}}\" style=\"width:480px;background:#fff;border-radius:4px;box-shadow:0 8px 24px rgba(0,0,0,.2)\">\n        <div style=\"padding:14px 18px;border-bottom:1px solid #ebeef5;font-weight:700\">{{dTitle}}<\/div>\n        <div style=\"padding:16px 18px;line-height:1.8;white-space:pre-line\">{{dBody}}<\/div>\n        <div style=\"padding:10px 18px 16px;display:flex;justify-content:flex-end;gap:10px\">\n          <sc-if value=\"{{dIsErr}}\" hint-placeholder-val=\"{{false}}\"><button class=\"btn pri\" onClick=\"{{closeDialog}}\">我知道了<\/button><\/sc-if>\n          <sc-if value=\"{{dIsConfirm}}\" hint-placeholder-val=\"{{false}}\"><button class=\"btn\" onClick=\"{{closeDialog}}\">取消<\/button><button class=\"btn pri\" onClick=\"{{doSave}}\">确认保存<\/button><\/sc-if>\n          <sc-if value=\"{{dIsDone}}\" hint-placeholder-val=\"{{false}}\"><button class=\"btn\" onClick=\"{{closeDialog}}\">继续编辑<\/button><a class=\"btn\" href=\"Main.dc.html\">返回活动列表<\/a><a class=\"btn pri\" href=\"Grant.dc.html\">去发放<\/a><\/sc-if>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/sc-if>\n<\/div>\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script data-props='{\"$preview\":{\"width\":1280,\"height\":2400}}'>\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = {\n      spins: ['F', 'F', 'P'],\n      slots: [\n        { amount: '7,890', prob: '0' }, { amount: '789', prob: '0' }, { amount: '78.9', prob: '0' },\n        { amount: '2.34', prob: '30' }, { amount: '1.23', prob: '35' }, { amount: '4.56', prob: '20' },\n        { amount: '12.3', prob: '5' }, { amount: '23.4', prob: '0' }, { amount: '45.6', prob: '0' }, { amount: '7.89', prob: '10' }\n      ],\n      tiers: [\n        { kind: 'F', min: '500', max: '1000', a1: '7', p1: '80', a2: '8', p2: '20' },\n        { kind: 'F', min: '1001', max: '5000', a1: '8', p1: '70', a2: '2', p2: '30' },\n        { kind: 'F', min: '5001', max: '', a1: '2', p1: '80', a2: '1', p2: '20' },\n        { kind: 'N', min: '500', max: '1000', a1: '6', p1: '80', a2: '7', p2: '20' },\n        { kind: 'N', min: '1001', max: '5000', a1: '7', p1: '70', a2: '8', p2: '30' },\n        { kind: 'N', min: '5001', max: '', a1: '8', p1: '80', a2: '1', p2: '20' }\n      ],\n      rcRel: 'gte', rcCount: '1',\n      channels: [{ name: 'PayMongo', on: true }, { name: 'Traxion Pay', on: true }, { name: 'PayCools', on: true }, { name: 'GCASH', on: false }],\n      dialog: null\n    };\n  }\n  num(v) { return Number(String(v).replace(/,/g, '')) || 0; }\n  fmt(v) { return '₱' + v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }\n  renderVals() {\n    const s = this.state;\n    const nF = s.spins.filter((t) => t === 'F').length, nP = s.spins.length - nF;\n    const hasFree = nF > 0, hasPaid = nP > 0;\n    const btn = 'padding:4px 10px;';\n    const upd = (key, i, patch) => this.setState({ [key]: s[key].map((x, j) => (j === i ? Object.assign({}, x, patch) : x)) });\n    // free\n    let fSum = 0, fExp = 0, fMax = 0;\n    s.slots.forEach((c) => { const p = parseInt(c.prob, 10) || 0, a = this.num(c.amount); fSum += p; fExp += a * p / 100; if (p > 0) fMax = Math.max(fMax, a); });\n    // paid\n    let pMax = 0;\n    const usedBy = s.slots.map(() => []);\n    const tierRows = s.tiers.map((t, i) => {\n      const p1 = parseInt(t.p1, 10) || 0, p2 = t.a2 === '' ? 0 : (parseInt(t.p2, 10) || 0);\n      const okSum = p1 + p2 === 100, okRange = this.num(t.min) >= 0 && (t.max === '' || this.num(t.max) >= this.num(t.min));\n      [t.a1, t.a2].forEach((a) => { if (a !== '' && s.slots[a]) { usedBy[a].push((t.kind === 'F' ? '首次' : '非首次') + ' ' + t.min + (t.max ? '–' + t.max : '+')); pMax = Math.max(pMax, this.num(s.slots[a].amount)); } });\n      return {\n        kind: t.kind, min: t.min, max: t.max, a1: t.a1, a2: t.a2, p1: t.p1, p2: t.a2 === '' ? '' : t.p2,\n        chk: !okRange ? '区间不合法' : (okSum ? '✓ 合计 100%' : '概率合计 ' + (p1 + p2) + '%'),\n        chkStyle: 'font-size:12px;' + (okSum && okRange ? 'color:#529b2e' : 'color:#f56c6c'),\n        setKind: (e) => upd('tiers', i, { kind: e.target.value }), setMin: (e) => upd('tiers', i, { min: e.target.value }), setMax: (e) => upd('tiers', i, { max: e.target.value }),\n        setA1: (e) => upd('tiers', i, { a1: e.target.value }), setA2: (e) => upd('tiers', i, { a2: e.target.value }),\n        setP1: (e) => upd('tiers', i, { p1: e.target.value }), setP2: (e) => upd('tiers', i, { p2: e.target.value }),\n        add: () => { const arr = s.tiers.slice(); arr.splice(i + 1, 0, { kind: t.kind, min: '', max: '', a1: t.a1, p1: '100', a2: '', p2: '' }); this.setState({ tiers: arr }); },\n        remove: () => (s.tiers.length > 1 ? this.setState({ tiers: s.tiers.filter((x, j) => j !== i) }) : null),\n        _ok: okSum && okRange\n      };\n    });\n    const paidNos = s.spins.map((t, i) => (t === 'P' ? i + 1 : 0)).filter(Boolean);\n    const freeNos = s.spins.map((t, i) => (t === 'F' ? i + 1 : 0)).filter(Boolean);\n    const spinRows = s.spins.map((t, i) => {\n      const isF = t === 'F';\n      return {\n        no: i + 1, rowStyle: isF ? '' : 'background:#fffaf0',\n        freeStyle: btn + (isF ? 'border:1px solid #3d8fd8;background:#ecf5ff;color:#3d8fd8' : 'border:1px solid #dcdfe6;background:#fff;color:#909399'),\n        paidStyle: btn + (!isF ? 'border:1px solid #e6a23c;background:#fdf6ec;color:#b88230' : 'border:1px solid #dcdfe6;background:#fff;color:#909399'),\n        unlock: isF ? (i === 0 ? '发放后即可转' : '上一转完成后即可转') : '上一转完成 + 充值到账且命中充值档位',\n        cfg: isF ? '免费转盘配置 ↓' : '付费转盘配置（充值配置表）↓',\n        cfgStyle: isF ? 'color:#3d8fd8' : 'color:#b88230',\n        setFree: () => this.setState({ spins: s.spins.map((x, j) => (j === i ? 'F' : x)) }),\n        setPaid: () => this.setState({ spins: s.spins.map((x, j) => (j === i ? 'P' : x)) }),\n        remove: () => (s.spins.length > 1 ? this.setState({ spins: s.spins.filter((x, j) => j !== i) }) : null),\n        delStyle: s.spins.length > 1 ? 'color:#f56c6c' : 'color:#c0c4cc;cursor:not-allowed'\n      };\n    });\n    const slotRows = s.slots.map((c, i) => ({\n      no: i + 1, pos: i === 0 ? '· 顶部大奖格' : '', amount: c.amount, prob: c.prob,\n      cost: this.fmt(this.num(c.amount) * (parseInt(c.prob, 10) || 0) / 100),\n      usedBy: hasPaid ? (usedBy[i].length ? usedBy[i].join('、') : '—') : '—',\n      onAmount: (e) => upd('slots', i, { amount: e.target.value }), onProb: (e) => upd('slots', i, { prob: e.target.value })\n    }));\n    const slotOpts = s.slots.map((c, i) => ({ v: String(i), label: '₱' + c.amount + '（' + (i + 1) + '格）' }));\n    const channels = s.channels.map((c, i) => ({ name: c.name, on: c.on, toggle: () => this.setState({ channels: s.channels.map((x, j) => (j === i ? { name: x.name, on: !x.on } : x)) }) }));\n    const save = () => {\n      const errs = [];\n      s.slots.forEach((c, i) => { if (!(this.num(c.amount) > 0)) errs.push('第 ' + (i + 1) + ' 格金额需大于 0'); });\n      if (hasFree && fSum !== 100) errs.push('免费中奖概率合计为 ' + fSum + '%，需等于 100%');\n      if (hasPaid) {\n        if (!s.channels.some((c) => c.on)) errs.push('充值渠道至少选 1 个');\n        tierRows.forEach((t, i) => { if (!t._ok) errs.push('第 ' + (i + 1) + ' 个充值档位：' + t.chk); });\n        ['F', 'N'].forEach((k) => {\n          const list = s.tiers.filter((t) => t.kind === k).map((t) => [this.num(t.min), t.max === '' ? Infinity : this.num(t.max)]).sort((a, b) => a[0] - b[0]);\n          for (let i = 1; i < list.length; i++) if (list[i][0] <= list[i - 1][1]) errs.push((k === 'F' ? '首次' : '非首次') + '档位充值区间有重叠');\n        });\n      }\n      if (errs.length) this.setState({ dialog: { kind: 'err', body: '请修改以下问题后再保存：\\n· ' + Array.from(new Set(errs)).join('\\n· ') } });\n      else this.setState({ dialog: { kind: 'confirm', body: '每人 ' + s.spins.length + ' 转：免费 ' + nF + ' 转、付费 ' + nP + ' 转。\\n单人最高成本 ' + this.fmt(nF * fMax + nP * pMax) + '。\\n保存后已发放未使用的次数按新配置抽奖，并写入操作日志。' } });\n    };\n    const d = s.dialog;\n    return {\n      spinRows, spinTotal: s.spins.length, spinFree: nF, spinPaid: nP,\n      spinMaxCost: this.fmt(nF * fMax + nP * pMax),\n      addSpin: () => (s.spins.length < 10 ? this.setState({ spins: s.spins.concat(['F']) }) : null),\n      hasFree, hasPaid,\n      slotTitle: hasFree ? '免费转盘配置（第 ' + freeNos.join('、') + ' 转使用）' : '盘面 10 格金额',\n      slotLabel: hasFree ? '免费转盘 · 10 格' : '盘面 10 格',\n      slotRows, fSum, fSumStyle: fSum === 100 ? 'color:#529b2e' : 'color:#f56c6c', fExp: this.fmt(fExp), fMax: '₱' + fMax,\n      paidSpinNos: paidNos.join('、'), tierRows, slotOpts, channels,\n      rcRel: s.rcRel, rcCount: s.rcCount,\n      setRcRel: (e) => this.setState({ rcRel: e.target.value }), setRcCount: (e) => this.setState({ rcCount: e.target.value }),\n      save,\n      hasDialog: !!d,\n      dTitle: d ? (d.kind === 'err' ? '无法保存' : d.kind === 'confirm' ? '确认保存' : '保存成功') : '',\n      dBody: d ? d.b
