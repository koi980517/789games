<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>白名单转盘原型 v0.5</title>
<style>
:root{--bg:#f4f6f9;--panel:#fff;--ink:#1f2933;--muted:#6b7785;--line:#e3e7ec;--accent:#1d6cae;--accent-soft:#e8f1fa;--stage:#e9edf2}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;font-size:14px}
header{background:#1d6cae;color:#fff;padding:14px 20px;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline}
header h1{margin:0;font-size:18px}
header span{opacity:.85;font-size:12px}
.wrap{display:flex;flex-wrap:wrap;min-height:calc(100vh - 52px)}
nav{flex:0 0 260px;background:var(--panel);border-right:1px solid var(--line);padding:12px 0}
nav h2{font-size:12px;color:var(--muted);margin:14px 18px 6px;font-weight:600;letter-spacing:.04em}
nav button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 18px;font:inherit;color:var(--ink);cursor:pointer;border-left:3px solid transparent}
nav button:hover{background:var(--bg)}
nav button[aria-current="true"]{background:var(--accent-soft);border-left-color:var(--accent);color:var(--accent);font-weight:600}
nav .tag{display:inline-block;margin-left:6px;font-size:10px;padding:0 5px;border-radius:2px;background:#ff8a00;color:#fff;vertical-align:middle}
main{flex:999 1 560px;min-width:0;padding:16px 20px 32px}
.bar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-bottom:12px}
.bar h3{margin:0;font-size:16px}
.back{border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:5px 10px;font:inherit;font-size:12px;cursor:pointer;color:var(--ink)}.back:disabled{opacity:.4;cursor:default}
.hint{font-size:12px;color:var(--muted);margin:0 0 10px}
.bar .meta{color:var(--muted);font-size:12px}
.bar label{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;margin-left:auto}
.stage{background:var(--stage);border:1px solid var(--line);border-radius:8px;padding:16px;overflow:auto}
.frame-box{margin:0 auto;transform-origin:top left}
iframe{border:0;display:block;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.12)}
.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-top:18px}
.note{background:var(--panel);border:1px solid var(--line);border-top:4px solid #c0c4cc;border-radius:6px;padding:12px 14px;white-space:pre-wrap;line-height:1.6;font-size:12px}
.note.blue{border-top-color:#3d8fd8}.note.orange{border-top-color:#ff8a00}.note.pink{border-top-color:#e85d8c}
@media (max-width:760px){nav{flex-basis:100%;border-right:0;border-bottom:1px solid var(--line)}main{padding:12px}}
</style>
</head>
<body>
<header><h1>789games · 白名单转盘原型 v0.5</h1><span>后台 4 张 + 前台 H5 3 张 · 06 可交互 · 2026-11-10</span></header>
<div class="wrap">
  <nav id="nav" aria-label="画板"></nav>
  <main>
    <div class="bar"><button type="button" id="back" class="back" disabled>← 上一页</button><h3 id="title"></h3><span class="meta" id="meta"></span>
      <label><input type="checkbox" id="fit" checked> 缩放适配宽度</label></div>
    <p class="hint">所有按钮都能点：跳转（创建 / 修改 / 页签）、弹窗（状态开关、删除、保存校验、导入前须保存）、白名单导入、筛选、下载模板 / 导出 CSV、首页入口 → 转盘 → 中奖弹窗。</p>
    <div class="stage" id="stage"><div class="frame-box" id="box"><iframe id="frame" title="原型画板"></iframe></div></div>
    <div class="notes" id="notes"></div>
  </main>
</div>

var NOTES = [{"page": "后台", "text": "现网读取（QA 后台 2026-11-10）老用户充值转盘\n\n• 菜单 活动中心 › 老用户充值转盘，页签：活动配置｜活动统计\n• 列表：活动编号/名称/类型/开始/结束/创建时间/总预算/已使用预算/创建人/状态（开关）/修改\n• 表单：活动展示开关（控制未登录可见）、名称、开始/结束时间、领取方式（手动/自动）、是否需要 KYC、是否需要充值记录、人群范围（充值次数 ≥ N）、充值渠道（PayMongo/Traxion Pay/PayCools/GCASH）、奖池总预算（空=不限）\n• 档位：首次 / 非首次，每档 = 充值区间 + 最多 2 个奖励金额 + 整数概率\n• 已有「白名单奖励档位」+ 白名单导入（CSV 只有 phone 列，需先保存活动）：白名单手机号充值时改走白名单档位，仍要充值才有次数\n• 流水：首次 / 非首次各配倍数，可勾选是否含本金、是否含奖金\n• 奖励弹窗文案（{bonus}）\n• 统计：会员账号 + 领取时间筛选，导出；领取总额；ID/会员ID/会员账号/活动类型/领取金额/日期/领取时间\n• 接口 /api/admin/activity/oldUserRechargeSpin/*，activityType=OLD_USER_RECHARGE_SPIN", "color": "blue"}, {"page": "后台", "text": "本原型的取舍（相对现网的改动）\n\n1. 独立菜单「白名单转盘」，activityType 新建（建议 WHITELIST_SPIN），与老用户充值转盘独立配置、独立预算、独立统计\n2. 去掉：人群范围、充值渠道、是否需要充值记录、旧白名单（手机号）导入、流水「含本金」\n3. 全部为免费转（付费及充值配置已移除）。转盘设置支持多转盘（免费转盘1、2…，最多 5 个），每个转盘独立 10 格奖励 + 概率、不同底色；转数设置里逐转指定用哪个转盘（行底色 = 转盘色）\n4. 不再单独设「白名单发放」页签：在创建 / 编辑页「白名单名单」导入，沿用现有导入逻辑（先保存活动、CSV 首行 phone、导入结果 + BatchId、已导入文件下载）；名单内用户各得 1 轮转数\n5. 次数随活动结束失效；活动关闭时不可抽\n7. 活动列表新增「删除」：仅关闭且无未使用次数可删，软删除，记录保留\n8. 流水要求新增「计入流水的游戏」：全部 / 指定游戏类别（6 类）/ 指定游戏（类别 → 厂商 → 游戏 ID 三级选择弹窗，复用返水活动）\n9. 预算：接入后台顶部「预算告警」（消耗 ≥ 70%，类型名「白名单转盘活动」）；本菜单活动列表上方也显示「预算预警」条，「已使用预算」列显示消耗进度（≥ 70% 橙色 +「预算预警」标签）；剩余预算 < 最小奖励时活动自动关闭（红色）\n10. 权限管理 › 活动中心新增「白名单转盘」101419 及 9 个按钮权限码\n11. 新增「操作日志」页签（活动配置 | 活动统计 | 操作日志）：记录新增 / 修改 / 开启 / 关闭 / 删除 / 白名单导入 / 名单下载 / 统计导出，以及系统的预算预警 / 预算不足自动关闭 / 活动结束；字段 操作时间、操作人、操作类型、活动、变更内容（旧值 → 新值）、IP；只读、时间倒序、每页 10 条、保留 365 天", "color": "orange"}, {"page": "后台", "text": "待确认\n\n• 大奖格 ₱7,890 是否允许配置大于 0 的概率（目前默认 0，只展示）\n• 免费 / 充值次数是否要不同的有效期或展示文案\n• 预算用完：已发未用次数是不能抽，还是照常发奖\n• 单次 / 单人累计发放上限（原型暂定单次 ≤ 10、批量 ≤ 5,000 行）\n• 是否要求是老用户（充值 ≥1）、冻结 / 风控账号是否拦截\n• 与老用户充值转盘同时有次数时的入口和弹窗优先级\n• 只在 789games 生效还是两站都上", "color": "pink"}, {"page": "前台 H5", "text": "视觉：2026-11-13 带入 Figma 设计稿「Whitelist Spin Page」（789Games 用户界面 UI Design，node 4786-71991）：首页挂件、每日活动弹窗、转盘页、中奖弹窗、次数用完弹窗。文案按已定稿（3 行弹窗、Win up to ₱7,890）；盘面金额、剩余次数、中奖轮播为实时数据。\n\n前台规则\n\n• 只有剩余次数 > 0 的白名单用户能看到入口；未登录、非白名单不展示（不复刻老用户转 e.target.value }),\n      setStatus: (e) => this.setState({ fStatus: e.target.value }),\n      search: () => this.setState({ applied: { name: s.fName.trim(), creator: s.fCreator.trim(), status: s.fStatus } }),\n      reset: () => this.setState({ fName: '', fCreator: '', fStatus: 'all', applied: { name: '', creator: '', status: 'all' } }),\n      hasDialog: !!dr, dTitle, dBody, dSub, dOk, dOkStyle,\n      cancel: () => this.setState({ dialog: null }), confirm,\n      hasToast: !!s.toast, toast: s.toast || '',\n      toastStyle: 'position:absolute;left:50%;top:70px;transform:translateX(-50%);padding:9px 18px;border-radius:4px;font-size:13px;box-shadow:0 4px 12px rgba(0,0,0,.12);' + (s.toastErr ? 'background:#fef0f0;color:#c45656;border:1px solid #fde2e2' : 'background:#f0f9eb;color:#529b2e;border:1px solid #e1f3d8')\n    };\n  }\n}\n<\/script>\n<\/body>\n<\/html>\n", "Config.dc.html": "<!doctype html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"utf-8\">\n<title>白名单转盘 · 创建活动<\/title>\n<script src=\"./support.js\"><\/script>\n<\/head>\n<body>\n<x-dc>\n<helmet>\n<style>\nbody{margin:0;font-family:\"PingFang SC\",\"Microsoft YaHei\",\"Noto Sans SC\",system-ui,sans-serif;font-size:13px;color:#303133;background:#f0f0f0}\na{color:#3d8fd8}a:hover{color:#1d6cae}\na.btn,a.tab{text-decoration:none;display:inline-block}\n.top{background:#1d6cae;color:#fff;display:flex;flex-wrap:wrap;gap:16px;align-items:center;padding:8px 16px}\n.top .time{color:#ffd24d;font-weight:600}\n.crumb{background:#fff;padding:10px 16px;border-bottom:1px solid #e4e7ed}\n.card{background:#fff;margin:16px;border-radius:4px;padding:16px 20px}\n.tabs{display:flex;gap:24px;border-bottom:2px solid #e4e7ed;margin-bottom:16px}\n.tab{padding:8px 2px;color:#606266}\n.tab.on{color:#3d8fd8;border-bottom:2px solid #3d8fd8;margin-bottom:-2px;font-weight:600}\n.btn{border:1px solid #dcdfe6;background:#fff;color:#606266;border-radius:3px;padding:7px 14px;font-size:12px;cursor:pointer;font-family:inherit}\n.btn.pri{background:#3d8fd8;border-color:#3d8fd8;color:#fff}\n.btn.txt{border:0;background:none;color:#3d8fd8;padding:2px 4px}\n.btn.danger{border:0;background:none;color:#f56c6c;padding:2px 4px}\n.inp{border:1px solid #dcdfe6;border-radius:3px;padding:6px 10px;font-size:12px;font-family:inherit;color:#303133;background:#fff}\n.sec{font-size:14px;font-weight:700;color:#1d6cae;border-left:3px solid #1d6cae;padding-left:8px;margin:22px 0 12px}\n.row{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:flex-start;padding:7px 0}\n.lab{width:240px;text-align:right;color:#606266;padding-top:6px;flex:0 0 240px}\n.ctl{flex:1 1 520px;min-width:0;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}\n.tip{color:#909399;font-size:12px}\n.new{display:inline-block;background:#ff8a00;color:#fff;font-size:10px;line-height:16px;padding:0 5px;border-radius:2px;margin-left:6px;vertical-align:middle}\n.del{display:inline-block;background:#909399;color:#fff;font-size:10px;line-height:16px;padding:0 5px;border-radius:2px;margin-left:6px;vertical-align:middle}\n.tbl{width:100%;border-collapse:collapse;font-size:12px}\n.tbl th{background:#f5f7fa;color:#606266;font-weight:600;text-align:left;padding:8px;border:1px solid #ebeef5;white-space:nowrap}\n.tbl td{padding:8px;border:1px solid #ebeef5}\n.scroll{overflow-x:auto}\n.sw{display:inline-block;width:34px;height:18px;border-radius:9px;background:#dcdfe6;position:relative;vertical-align:middle}\n.sw::after{content:\"\";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff}\n.gone{background:#f4f4f5;border:1px dashed #c0c4cc;color:#909399;border-radius:3px;padding:10px 12px;line-height:1.7;font-size:12px}\n.sub{font-size:13px;font-weight:700;color:#303133;margin:4px 0 8px}\n.panel{border:1px solid #e4e7ed;border-radius:4px;padding:12px 14px;margin:6px 0 4px}\n.panel.free{border-left:4px solid #3d8fd8}\n.cb{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;border:1px solid #c0c4cc;border-radius:2px;background:#fff;color:#fff;font-size:11px;line-height:1;padding:0;cursor:pointer;flex:0 0 14px}\n.cb.on{background:#3d8fd8;border-color:#3d8fd8}\n.gl{display:flex;align-items:center;gap:6px;cursor:pointer;color:#1d6cae;font-size:12px;min-width:0}\n.gid{color:#c0c4cc;font-size:11px;white-space:nowrap}\n<\/style>\n<\/helmet>\n<div style=\"width:100%;min-height:2400px;position:relative\">\n  <div class=\"top\"><span class=\"time\">当前时间: 2026/11/10 15:40:00 +08:00<\/span><span style=\"margin-left:auto\">简体中文<\/span><span>Koi0930<\/span><\/div>\n  <div class=\"crumb\">位置 › 活动中心 › 白名单转盘 › 创建活动<\/div>\n  <div class=\"card\">\n    <div class=\"tabs\"><a class=\"tab on\" href=\"Main.dc.html\">活动配置<\/a><a class=\"tab\" href=\"Stats.dc.html\">活动统计<\/a><a class=\"tab\" href=\"OpLog.dc.html\">操作日志<\/a><\/div>\n    <a class=\"btn\" href=\"Main.dc.html\">返回<\/a>\n\n    <div class=\"row\" style=\"margin-top:12px\"><span class=\"lab\">活动展示开关<\/span><span class=\"ctl\"><span class=\"sw\" role=\"img\" aria-label=\"关闭\"><\/span><span class=\"tip\">开启后，剩余次数 &gt; 0 的白名单用户可看到入口；未登录用户一律不展示<\/span><\/span><\/div>\n\n    <div class=\"sec\">基础配置<\/div>\n    <div class=\"row\"><label class=\"lab\" for=\"n\">* 活动名称<\/label><span class=\"ctl\"><input id=\"n\" class=\"inp\" style=\"width:320px\" value=\"12月召回白名单转盘\"><\/span><\/div>\n    <div class=\"row\"><span class=\"lab\">* 活动开始时间<\/span><span class=\"ctl\"><input class=\"inp\" style=\"width:200px\" value=\"2026-12-01 00:00:00\" aria-label=\"活动开始时间\"><span class=\"tip\">GMT+8<\/span><\/span><\/div>\n    <div class=\"row\"><span class=\"lab\">* 活动结束时间<\/span><span class=\"ctl\"><input class=\"inp\" style=\"width:200px\" value=\"2026-12-31 23:59:59\" aria-label=\"活动结束时间\"><span class=\"tip\">活动结束后，未使用的次数自动失效<\/span><\/span><\/div>\n    <div class=\"row\"><span class=\"lab\">领取方式<\/span><span class=\"ctl\"><label><input type=\"radio\" name=\"r\" checked> 手动领取<\/label><label><input type=\"radio\" name=\"r\"> 自动发放<\/label><\/span><\/div>\n    <div class=\"row\"><span class=\"lab\">是否需要KYC<\/span><span class=\"ctl\"><label><input type=\"radio\" name=\"k\"> 是<\/label><label><input type=\"radio\" name=\"k\" checked> 否<\/label><span class=\"tip\">与现网一致<\/span><\/span><\/div>\n    <div class=\"row\"><label class=\"lab\" for=\"b\">奖池总预算额度<\/label><span class=\"ctl\"><input id=\"b\" class=\"inp\" style=\"width:200px\" value=\"300000\"><span class=\"tip\">留空为不限金额；已使用 ₱0.00<\/span><\/span><\/div>\n    <div class=\"row\"><span class=\"lab\">预算告警<\/span><span class=\"ctl\"><span class=\"tip\" style=\"line-height:1.7\">沿用后台顶部「预算告警」：预算消耗 ≥ {{alertPct}}%（全局阈值）时，本活动进入告警列表，显示为「白名单转盘活动 · 活动名 · 消耗率」，告警数 +1。同时在本菜单活动列表上方显示「预算预警」条，「已使用预算」列显示消耗进度和「预算预警」标签。<\/span><\/span><\/div>\n    <div class=\"row\"><span class=\"lab\">预算不足自动关闭<\/span><span class=\"ctl\"><span class=\"tip\" style=\"line-height:1.7\">剩余预算 &lt; 当前最小奖励（<b style=\"color:#303133\">{{minReward}}<\/b>，取所有被使用转盘中概率 &gt; 0 的最小金额）时，活动自动关闭：状态开关变为关闭、前台入口隐藏、未使用次数不可抽，写操作日志并在列表标记「预算不足自动关闭」。补充预算后可手动重新开启。<\/span><\/span><\/div>\n\n    <div class=\"sec\">转数设置<\/div>\n    <div class=\"row\"><span class=\"lab\">每人转数<\/span><span class=\"ctl\" style=\"display:block\">\n      <div class=\"tip\" style=\"margin-bottom:8px\">全部为免费转。逐转选择使用哪个转盘（每个转盘的奖励和概率在下方「转盘设置」配置，行底色 = 转盘颜色），按顺序转，最多 10 转。<\/div>\n      <div class=\"scroll\"><table class=\"tbl\" style=\"max-width:820px\">\n        <thead><tr><th>转次<\/th><th>使用转盘<\/th><th>解锁条件<\/th><th>单转最高奖<\/th><th>单转期望<\/th><th>操作<\/th><\/tr><\/thead>\n        <tbody>\n          <sc-for list=\"{{spinRows}}\" as=\"t\" hint-placeholder-count=\"3\">\n            <tr style=\"{{t.rowStyle}}\"><td><span style=\"{{t.dotStyle}}\" aria-hidden=\"true\"><\/span> 第 {{t.no}} 转<\/td>\n              <td><select class=\"inp\" style=\"width:150px\" value=\"{{t.wheel}}\" onChange=\"{{t.setWheel}}\" aria-label=\"使用转盘\"><sc-for list=\"{{wheelOpts}}\" as=\"o\" hint-placeholder-count=\"2\"><option value=\"{{o.v}}\">{{o.label}}<\/option><\/sc-for><\/select><\/td>\n              <td>{{t.unlock}}<\/td><td>{{t.max}}<\/td><td>{{t.exp}}<\/td>\n              <td><button class=\"btn txt\" onClick=\"{{t.remove}}\" style=\"{{t.delStyle}}\">删除<\/button><\/td><\/tr>\n          <\/sc-for>\n        <\/tbody>\n      <\/table><\/div>\n      <div style=\"display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;margin-top:10px;font-size:12px\">\n        <button class=\"btn\" onClick=\"{{addSpin}}\">+ 新增一转<\/button>\n        <span>每人共 <b>{{spinTotal}}<\/b> 转<\/span>\n        <span>单人最高成本 <b>{{spinMaxCost}}<\/b> · 期望成本 <b>{{spinExpCost}}<\/b><\/span>\n      <\/div>\n    <\/span><\/div>\n\n    <div class=\"sec\" id=\"wl\">白名单名单<\/div>\n    <div class=\"row\"><span class=\"lab\">名单状态<\/span><span class=\"ctl\"><span>{{wlStatus}}<\/span><\/span><\/div>\n    <div class=\"row\"><span class=\"lab\">白名单导入<\/span><span class=\"ctl\" style=\"display:block\">\n      <div style=\"display:flex;flex-wrap:wrap;gap:8px;align-items:center\">\n        <button class=\"btn\" onClick=\"{{importCsv}}\" style=\"{{importStyle}}\">导入文件<\/button>\n        <a class=\"btn\" href=\"{{tplHref}}\" download=\"whitelist_spin_template.csv\">模板下载<\/a>\n        <sc-if value=\"{{hasList}}\" hint-placeholder-val=\"{{false}}\"><a class=\"btn\" href=\"{{exportHref}}\" download=\"whitelist_check.csv\">已导入文件下载<\/a><\/sc-if>\n        <span class=\"tip\">仅支持 CSV（首行表头 phone，每行 1 个 09 开头 11 位手机号）<\/span>\n      <\/div>\n      <sc-if value=\"{{needSave}}\" hint-placeholder-val=\"{{true}}\"><div style=\"color:#e6a23c;font-size:12px;margin-top:6px\">请先保存活动后再导入白名单<\/div><\/sc-if>\n      <sc-if value=\"{{hasResult}}\" hint-placeholder-val=\"{{false}}\">\n        <div style=\"background:#f4f4f5;border-radius:3px;padding:8px 12px;margin-top:8px;font-size:12px;line-height:1.8;max-width:620px\"><b>导入结果：<\/b><br>总行数: {{r.total}} | 有效: {{r.valid}} | 无效: {{r.invalid}} | 文件内重复: {{r.dup}} | 插入: {{r.inserted}} | 已存在: {{r.existed}}<br>BatchId: {{r.batch}}<\/div>\n      <\/sc-if>\n      <div class=\"tip\" style=\"margin-top:8px;line-height:1.7\">名单内每个用户获得 1 轮转数（按上方「转数设置」：第 1–{{spinTotal}} 转）。未注册手机号注册后自动生效；同一手机号重复导入不重复发放。多次导入为追加。<\/div>\n    <\/span><\/div>\n\n    <div class=\"sec\">转盘设置<\/div>\n    <div class=\"row\"><span class=\"lab\">转盘<\/span><span class=\"ctl\" style=\"display:block\">\n      <div class=\"tip\" style=\"margin-bottom:10px;line-height:1.7\">每个转盘都是一套独立的 10 格奖励（金额）+ 中奖概率（整数，合计 100%，0 = 只展示不命中），顺时针从顶部开始，第 1 格为大奖格。不同转盘用不同底色区分；在上方「转数设置」里指定第几转用哪个转盘，前台转到这一转时，盘面显示该转盘的 10 格金额。<\/div>\n      <div style=\"display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start\">\n        <sc-for list=\"{{wheelCols}}\" as=\"w\" hint-placeholder-count=\"2\">\n          <div style=\"{{w.boxStyle}}\">\n            <div style=\"display:flex;align-items:center;gap:6px;margin-bottom:4px\"><span style=\"{{w.dotStyle}}\" aria-hidden=\"true\"><\/span><input class=\"inp\" style=\"width:130px;padding:3px 6px;font-weight:700\" value=\"{{w.name}}\" onChange=\"{{w.rename}}\" aria-label=\"转盘名称\"><button class=\"btn txt\" onClick=\"{{w.remove}}\" style=\"{{w.delStyle}}\" title=\"{{w.delTitle}}\">删除<\/button><\/div>\n            <div style=\"{{w.usedStyle}}\">{{w.usedBy}}<\/div>\n            <table class=\"tbl\" style=\"background:#fff\">\n              <thead><tr><th style=\"{{w.thStyle}}\">格<\/th><th style=\"{{w.thStyle}}\">奖励金额（₱）<\/th><th style=\"{{w.thStyle}}\">概率<\/th><th style=\"{{w.thStyle}}\">期望<\/th><\/tr><\/thead>\n              <tbody>\n                <sc-for list=\"{{w.rows}}\" as=\"r\" hint-placeholder-count=\"10\">\n                  <tr style=\"{{r.rowStyle}}\"><td style=\"white-space:nowrap\">{{r.no}}<span class=\"tip\">{{r.pos}}<\/span><\/td>\n                    <td><input class=\"inp\" style=\"width:76px\" value=\"{{r.amount}}\" onChange=\"{{r.onAmount}}\" aria-label=\"奖励金额\"><\/td>\n                    <td style=\"white-space:nowrap\"><input class=\"inp\" style=\"{{r.pStyle}}\" value=\"{{r.prob}}\" onChange=\"{{r.onProb}}\" aria-label=\"中奖概率\"> %<\/td>\n                    <td class=\"tip\">{{r.cost}}<\/td><\/tr>\n                <\/sc-for>\n                <tr style=\"{{w.footStyle}}\"><td colspan=\"2\"><b>合计 / 期望 / 最高<\/b><\/td><td><b style=\"{{w.sumStyle}}\">{{w.sum}}%<\/b><\/td><td style=\"font-size:12px;line-height:1.5\">{{w.exp}}<br>最高 {{w.max}}<\/td><\/tr>\n              <\/tbody>\n            <\/table>\n          <\/div>\n        <\/sc-for>\n        <button class=\"btn\" onClick=\"{{addWheel}}\" style=\"width:120px;height:120px;border-style:dashed;font-size:13px\">+ 新增转盘<br><span class=\"tip\">最多 5 个<\/span><\/button>\n      <\/div>\n    <\/span><\/div>\n\n    <div class=\"sec\">流水要求<\/div>\n    <div class=\"row\"><label class=\"lab\">彩金提现所需流水倍数<\/label><span class=\"ctl\"><input class=\"inp\" style=\"width:100px\" value=\"{{mult}}\" onChange=\"{{setMult}}\" aria-label=\"流水倍数\"> 倍<span class=\"tip\">稽核流水 = 中奖金额 × 倍数<\/span><\/span><\/div>\n    <div class=\"row\"><span class=\"lab\">稽核流水是否包含奖金<\/span><span class=\"ctl\"><label><input type=\"radio\" name=\"fb\" checked> 是<\/label><label><input type=\"radio\" name=\"fb\"> 否<\/label><\/span><\/div>\n    <div class=\"row\"><span class=\"lab\">计入流水的游戏<\/span><span class=\"ctl\" style=\"display:block\">\n      <div style=\"display:flex;flex-wrap:wrap;gap:16px\">\n        <label><input type=\"radio\" name=\"scope\" checked=\"{{scAll}}\" onChange=\"{{useAll}}\"> 全部游戏<\/label>\n        <label><input type=\"radio\" name=\"scope\" checked=\"{{scCat}}\" onChange=\"{{useCat}}\"> 指定游戏类别<\/label>\n        <label><input type=\"radio\" name=\"scope\" checked=\"{{scGame}}\" onChange=\"{{useGame}}\"> 指定游戏<\/label>\n      <\/div>\n      <sc-if value=\"{{scCat}}\" hint-placeholder-val=\"{{false}}\">\n        <div style=\"display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:10px\">\n          <sc-for list=\"{{catChecks}}\" as=\"c\" hint-placeholder-count=\"6\"><label style=\"display:inline-flex;gap:4px;align-items:center\"><input type=\"checkbox\" checked=\"{{c.on}}\" onChange=\"{{c.toggle}}\"> {{c.name}}<span class=\"tip\">{{c.count}} 款<\/span><\/label><\/sc-for>\n        <\/div>\n        <div class=\"tip\" style=\"margin-top:6px\">只有所选类别下游戏的有效投注计入流水；类别下新上架的游戏自动计入。<\/div>\n      <\/sc-if>\n      <sc-if value=\"{{scGame}}\" hint-placeholder-val=\"{{false}}\">\n        <div style=\"display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px\">\n          <button class=\"btn pri\" onClick=\"{{openPicker}}\">选择游戏<\/button>\n          <span>已选 <b>{{selCount}}<\/b> 款<\/span><span class=\"tip\">{{selSummary}}<\/span>\n        <\/div>\n        <div style=\"display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;max-width:900px\">\n          <sc-for list=\"{{selChips}}\" as=\"g\" hint-placeholder-count=\"6\"><span style=\"background:#ecf5ff;color:#3d8fd8;border-radius:3px;padding:2px 8px;font-size:12px\">{{g.name}} <span class=\"gid\">{{g.id}}<\/span><\/span><\/sc-for>\n        <\/div>\n        <div class=\"tip\" style=\"margin-top:6px\">只有所选游戏的有效投注计入流水；保存时提交游戏 ID。<\/div>\n      <\/sc-if>\n    <\/span><\/div>\n\n    <div class=\"sec\">活动文案配置<\/div>\n    <div class=\"row\"><span class=\"lab\"><label><input type=\"checkbox\" checked> 奖励弹窗文案<\/label><\/span><span class=\"ctl\"><input class=\"inp\" style=\"width:420px\" value=\"Get ₱ {bonus} From Lucky Spin\" aria-label=\"奖励弹窗文案\"><span class=\"tip\">支持 {bonus}<\/span><\/span><\/div>\n    <div class=\"row\"><label class=\"lab\" for=\"g\">获得次数提示文案<\/label><span class=\"ctl\"><input id=\"g\" class=\"inp\" style=\"width:420px\" value=\"You've got {count} Lucky Spins! Spin now to win up to ₱{max}\"><span class=\"tip\">支持 {count} {max}；为空则不弹<\/span><\/span><\/div>\n\n    <div style=\"display:flex;justify-content:center;gap:12px;margin-top:28px\"><a class=\"btn\" href=\"Main.dc.html\">取消<\/a><button class=\"btn pri\" onClick=\"{{save}}\">保存<\/button><\/div>\n  <\/div>\n\n  <sc-if value=\"{{pickerOpen}}\" hint-placeholder-val=\"{{false}}\">\n    <div style=\"{{pickWrap}}\">\n      <div role=\"dialog\" aria-label=\"选择指定游戏\" style=\"width:720px;max-width:calc(100% - 32px);background:#fff;border-radius:6px;box-shadow:0 8px 28px rgba(0,0,0,.25)\">\n        <div style=\"display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid #ebeef5\"><b style=\"font-size:16px\">选择指定游戏 · 白名单转盘流水<\/b><button class=\"btn txt\" onClick=\"{{closePicker}}\" aria-label=\"关闭\" style=\"font-size:18px;color:#909399\">✕<\/button><\/div>\n        <div style=\"padding:12px 20px 0\">\n          <div class=\"tip\" style=\"margin-bottom:8px\">支持 游戏类型 → 游戏厂商 → 具体游戏 三级选择，勾选上级自动联动下级，以最终勾选的游戏范围生效；可按名称或游戏 ID 搜索。<\/div>\n          <div style=\"display:flex;gap:16px;align-items:center;flex-wrap:wrap\">\n            <input class=\"inp\" style=\"width:260px\" placeholder=\"搜索游戏名称 / 游戏ID\" value=\"{{q}}\" onChange=\"{{setQ}}\" aria-label=\"搜索游戏\">\n            <label style=\"font-size:12px;display:inline-flex;gap:4px;align-items:center\"><input type=\"checkbox\" checked=\"{{onlySel}}\" onChange=\"{{toggleOnlySel}}\"> 只看已选<\/label>\n            <span style=\"margin-left:auto\">已选 <b>{{tmpCount}}<\/b> 款<\/span>\n          <\/div>\n        <\/div>\n        <div style=\"margin:10px 20px;border:1px solid #ebeef5;border-radius:4px;height:420px;overflow:auto;padding:10px 12px\">\n          <div style=\"display:flex;align-items:center;gap:6px;font-weight:600;margin-bottom:6px\"><button class=\"{{allCls}}\" onClick=\"{{toggleAll}}\" aria-label=\"全部\">{{allMark}}<\/button>全部 <span class=\"tip\">{{allCnt}}<\/span><\/div>\n          <sc-for list=\"{{tree}}\" as=\"c\" hint-placeholder-count=\"6\">\n            <div style=\"margin:4px 0 4px 18px\">\n              <div style=\"display:flex;align-items:center;gap:6px;font-weight:600\"><button class=\"{{c.cls}}\" onClick=\"{{c.toggle}}\" aria-label=\"{{c.name}}\">{{c.mark}}<\/button><button class=\"btn txt\" onClick=\"{{c.expand}}\" style=\"color:#303133;padding:0;font-weight:600\">{{c.arrow}} {{c.name}}<\/button><span cl dius:50%;margin-right:4px;background:' + PAL0[wi % 5][0],\n      unlock: i === 0 ? '进入白名单后即可转' : '上一转完成后即可转',\n      max: '₱' + (stats[wi] ? stats[wi].max : 0).toLocaleString('en-US'),\n      exp: this.fmt(stats[wi] ? stats[wi].exp : 0),\n      setWheel: (e) => this.setState({ spins: s.spins.map((x, j) => (j === i ? parseInt(e.target.value, 10) : x)) }),\n      remove: () => (s.spins.length > 1 ? this.setState({ spins: s.spins.filter((x, j) => j !== i) }) : null),\n      delStyle: s.spins.length > 1 ? 'color:#f56c6c' : 'color:#c0c4cc;cursor:not-allowed'\n    }));\n    let maxCost = 0, expCost = 0;\n    s.spins.forEach((wi) => { if (stats[wi]) { maxCost += stats[wi].max; expCost += stats[wi].exp; } });\n    const PAL = [['#3d8fd8', '#ecf5ff'], ['#e6a23c', '#fdf6ec'], ['#67c23a', '#f0f9eb'], ['#9b59d0', '#f4ecff'], ['#e8608a', '#fef0f5']];\n    const col = (k) => PAL[k % PAL.length];\n    const updW = (k, patch) => this.setState({ wheels: s.wheels.map((x, j) => (j === k ? Object.assign({}, x, patch) : x)) });\n    const wheelCols = s.wheels.map((w, k) => {\n      const used = s.spins.map((wi, i) => (wi === k ? i + 1 : 0)).filter(Boolean);\n      const canDel = s.wheels.length > 1 && used.length === 0;\n      const [c, bg] = col(k);\n      return {\n        name: w.name, sum: stats[k].sum, exp: '期望 ' + this.fmt(stats[k].exp), max: '₱' + stats[k].max.toLocaleString('en-US'),\n        sumStyle: stats[k].sum === 100 ? 'color:#529b2e' : 'color:#f56c6c',\n        boxStyle: 'width:330px;box-sizing:border-box;border:2px solid ' + c + ';background:' + bg + ';border-radius:8px;padding:10px',\n        dotStyle: 'display:inline-block;width:12px;height:12px;border-radius:50%;background:' + c,\n        thStyle: 'background:' + bg + ';color:' + c,\n        footStyle: 'background:' + bg,\n        usedStyle: 'font-size:12px;margin:0 0 8px 18px;color:' + (used.length ? c : '#909399'),\n        usedBy: used.length ? '第 ' + used.join('、') + ' 转使用' : '未被使用',\n        rows: w.amounts.map((a, i) => {\n          const p = parseInt(w.probs[i], 10) || 0;\n          return {\n            no: i + 1, pos: i === 0 ? ' 大奖' : '', amount: a, prob: w.probs[i],\n            rowStyle: p > 0 ? '' : 'opacity:.75',\n            pStyle: 'width:50px;' + (p > 0 ? 'font-weight:700;color:' + c : 'color:#c0c4cc'),\n            cost: this.fmt(this.num(a) * p / 100),\n            onAmount: (e) => updW(k, { amounts: w.amounts.map((x, m) => (m === i ? e.target.value : x)) }),\n            onProb: (e) => updW(k, { probs: w.probs.map((x, m) => (m === i ? e.target.value : x)) })\n          };\n        }),\n        rename: (e) => updW(k, { name: e.target.value }),\n        remove: (e) => {\n          if (!canDel) { this.setState({ dlgTop: at(e, 120), dialog: { kind: 'err', body: s.wheels.length <= 1 ? '至少保留 1 个转盘。' : '「' + w.name + '」正被第 ' + used.join('、') + ' 转使用，请先在「转数设置」改用其他转盘。' } }); return; }\n          this.setState({ wheels: s.wheels.filter((x, j) => j !== k), spins: s.spins.map((wi) => (wi > k ? wi - 1 : wi)) });\n        },\n        delStyle: canDel ? 'color:#f56c6c;padding:0;margin-left:auto' : 'color:#c0c4cc;padding:0;margin-left:auto',\n        delTitle: canDel ? '删除转盘' : '被使用中或仅剩 1 个，不可删除'\n      };\n    });\n    const addWheel = (e) => (s.wheels.length < 5 ? this.setState({ wheels: s.wheels.concat([{ name: '免费转盘' + (s.wheels.length + 1), amounts: s.wheels[s.wheels.length - 1].amounts.slice(), probs: s.wheels[s.wheels.length - 1].probs.slice() }]) }) : this.setState({ dlgTop: at(e, 120), dialog: { kind: 'err', body: '最多 5 个转盘。' } }));\n    // game scope\n    const allGames = [];\n    GAME_LIB.forEach((c) => c.providers.forEach((p) => p.games.forEach((g) => allGames.push({ cat: c.name, prov: p.name, id: g.id, name: g.name }))));\n    const byId = {}; allGames.forEach((g) => { byId[g.id] = g; });\n    const catChecks = GAME_LIB.map((c) => ({\n      name: c.name, on: !!s.cats[c.name],\n      count: c.providers.reduce((a, p) => a + p.games.length, 0),\n      toggle: () => y: s.y, moved: false }; try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {} this.setState({ dragging: true }); };\n    const move = (e) => { const d = this._d; if (!d) return; const dx = e.clientX - d.sx, dy = e.clientY - d.sy; if (Math.abs(dx) + Math.abs(dy) > 5) d.moved = true; this.setState({ x: Math.max(0, Math.min(390 - W, d.ox + dx)), y: Math.max(70, Math.min(740 - H, d.oy + dy)) }); };\n    const up = () => { const d = this._d; this._d = null; if (!d) return; if (!d.moved) { this.setState({ dragging: false }); const a = document.querySelector('[data-go-wheel]'); if (a) a.click(); return; } const cx = this.state.x + W / 2; this.setState({ dragging: false, x: cx < 195 ? 4 : 390 - W - 4 }); };\n    const t = s.dragging ? 'none' : 'left .25s ease, top .25s ease';\n    return {\n      show: !s.hidden, hidden: s.hidden, spins: s.spins, down, move, up,\n      wrapStyle: 'position:absolute;left:' + s.x + 'px;top:' + s.y + 'px;width:' + W + 'px;height:' + H + 'px;cursor:grab;z-index:2;user-select:none;touch-action:none;transition:' + t,\n      imgStyle: 'width:' + W + 'px;height:' + H + 'px;display:block;pointer-events:none;animation:none;transform:' + (s.dragging ? 'scale(1.06)' : 'none'),\n    };\n  }\n}\n<\/script>\n<\/body>\n<\/html>\n", "H5Entry.dc.html": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<title>Home widget + daily popup<\/title>\n<script src=\"./support.js\"><\/script>\n<\/head>\n<body>\n<x-dc>\n<helmet>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&amp;family=Inter:wght@400;600;700;800&amp;display=swap\">\n<style>\nbody{margin:0}\n<\/style>\n<\/helmet>\n<div style=\"width:390px;height:844px;position:relative;overflow:hidden;font-family:Inter,sans-serif;background:#e9f6f1 url(data:image/webp;base64,UklGRjz2AABXRUJQVlA4IDD2AAAQxAKdASqGAUwDPm0skkYkIqitrPdMCbANiWpI4GnYOdfOWVmWhuEfvoQZnwuuDJaO4Dtz49vlv+I/4Xoq5TF1Rfo20Roy/lf33tTwney/y/7W/mH8wPFvXv6L+7/5//cf3z9xvv {\"editor\":null},\"onResult\":{\"editor\":null},\"embedded\":{\"editor\":null},\"winners\":{\"editor\":null},\"$preview\":{\"width\":390,\"height\":844}}'>\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    let muted = false; try { muted = localStorage.getItem('wlspin_muted') === '1'; } catch (e) {}\n    this.state = { rot: 0, spinning: false, flash: false, resultIdx: null, localSpins: 2, tick: 0, anim: true, own: [], muted };\n  }\n  componentDidMount() {\n    this._t = setInterval(() => this.tick(), 2200);\n    this._kick = () => { if (!this.state.muted) this.bgmStart(); };\n    document.addEventListener('pointerdown', this._kick, true);\n    if (!this.state.muted) this.bgmStart();\n  }\n  componentWillUnmount() {\n    clearInterval(this._t);\n    document.removeEventListener('pointerdown', this._kick, true);\n    this.bgmStop();\n    cancelAnimationFrame(this._raf);\n  }\n  ac() {\n    try {\n      if (!this._ac) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; this._ac = new C(); this._master = this._ac.createGain(); this._master.gain.value = 0.9; this._master.connect(this._ac.destination); }\n      if (this._ac.state === 'suspended') this._ac.resume();\n      return this._ac;\n    } catch (e) { return null; }\n  }\n  tone(freq, t, dur, type, vol, dest) {\n    const a = this._ac, o = a.createOscillator(), g = a.createGain();\n    o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);\n    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol || 0.2, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);\n    o.connect(g); g.connect(dest || this._master); o.start(t); o.stop(t + dur + 0.05);\n  }\n  sfx(name, big) {\n    if (this.state.muted) return;\n    const a = this.ac(); if (!a) return;\n    const t = a.currentTime;\n    if (name === 'click') { this.tone(880, t, 0.08, 'square', 0.06); }\n    if (name === 'go') { this.tone(523, t, 0.12, 'square', 0.08); this.tone(784, t + 0.07, 0.18, 'square', 0.08); }\n    if (name === 'tick') { this.tone(1800, t, 0.03, 'square', 0.05); }\n    if (name === 'stop') { this.tone(196, t, 0.25, 'triangle', 0.25); this.tone(1320, t, 0.12, 'sine', 0.08); }\n    if (name === 'win') {\n      const notes = big ? [523, 659, 784, 1047, 1319, 1568, 2093] : [523, 659, 784, 1047];\n      notes.forEach((f, i) => { this.tone(f, t + i * 0.09, 0.35, 'triangle', 0.16); this.tone(f * 2, t + i * 0.09, 0.2, 'sine', 0.05); });\n      if (big) for (let i = 0; i < 14; i++) this.tone(2400 + Math.random() * 1600, t + 0.6 + i * 0.05, 0.12, 'sine', 0.05);\n    }\n  }\n  bgmStart() {\n    const a = this.ac(); if (!a || this._bgm) return;\n    const g = a.createGain(); g.gain.value = 0.05; g.connect(this._master);\n    const mel = [659, 784, 880, 784, 659, 587, 523, 587, 659, 784, 1047, 880, 784, 659, 587, 659];\n    const bass = [131, 131, 175, 175, 196, 196, 131, 131];\n    const beat = 0.24; let step = 0, next = a.currentTime + 0.05;\n    const loop = () => {\n      while (next < a.currentTime + 0.3) {\n        this.tone(mel[step % 16], next, beat * 0.9, 'triangle', 0.5, g);\n        if (step % 2 === 0) this.tone(bass[(step / 2) % 8], next, beat * 1.8, 'sine', 0.7, g);\n        next += beat; step++;\n      }\n    };\n    loop();\n    this._bgm = { g, id: setInterval(loop, 100) };\n  }\n  bgmStop() {\n    if (!this._bgm) return;\n    clearInterval(this._bgm.id);\n    try { this._bgm.g.gain.setTargetAtTime(0.0001, this._ac.currentTime, 0.1); } catch (e) {}\n    this._bgm = null;\n  }\n  duck(on) {\n    if (!this._bgm || !this._ac) return;\n    this._bgm.g.gain.setTargetAtTime(on ? 0.015 : 0.05, this._ac.currentTime, 0.2);\n  }\n  watchTicks() {\n    const el = document.querySelector('[data-disc]'); if (!el) return;\n    let last = null;\n    const run = () => {\n      if (!this.state.spinning) return;\n      const m = getComputedStyle(el).transform;\n      if (m && m !== 'none') {\n        const v = m.split('(')[1].split(')')[0].split(',').map(Number);\n        const ang = (Math.atan2(v[1], v[0]) * 180 / Math.PI + 360) % 360;\n        const seg = Math.floor((ang + 18) / 36);\n        if (last !== null && seg !== last) this.sfx('tick');\n        last = seg;\n      }\n      this._raf = requestAnimationFrame(run);\n    };\n    this._raf = requestAnimationFrame(run);\n  }\n  wins() {\n    const seed = [\n      { user: 'Liz***3307', amount: 789 }, { user: 'Mar***1190', amount: 23.4 }, { user: 'Jun***0032', amount: 4.56 },\n      { user: 'Ali***7745', amount: 78.9 }, { user: 'Ros***2281', amount: 45.6 }, { user: 'Ken***9034', amount: 1.23 },\n      { user: 'Joy***5520', amount: 12.3 }, { user: 'Ben***6618', amount: 2.34 }, { user: 'Dan***7472', amount: 7.89 },\n      { user: 'Cha***0915', amount: 23.4 }, { user: 'Mik***4480', amount: 45.6 }, { user: 'Ros***1006', amount: 789 }\n    ];\n    return this.props.winners || this.state.own.concat(seed);\n  }\n  tick() {\n    const n = this.wins().length;\n    if (n <= 2) return;\n    const i = this.state.tick + 1;\n    this.setState({ tick: i, anim: true });\n    if (i >= n) setTimeout(() => this.setState({ tick: 0, anim: false }), 600);\n  }\n  fmt(n) {\n    const v = Number(n) || 0;\n    return '₱' + (v >= 1000 ? v.toLocaleString('en-US') : String(v));\n  }\n  renderVals() {\n    const slots = this.props.slots || [7890, 789, 78.9, 2.34, 1.23, 4.56, 12.3, 23.4, 45.6, 7.89];\n    const probs = this.props.probs || [0, 5, 25, 0, 0, 0, 0, 40, 30, 0];\n    const embedded = !!this.props.embedded;\n    const left = this.props.spins != null ? this.props.spins : this.state.localSpins;\n    const n = 10, step = 36, c = 146;\n    const cols = ['#a64be0'];\n    for (let i = 1; i < n; i++) cols.push(i % 2 ? '#fff3d8' : '#fde6b8');\n    const stops = cols.map((col, i) => col + ' ' + (i * step) + 'deg ' + ((i + 1) * step) + 'deg').join(',');\n    const discStyle = 'position:absolute;left:50.5px;top:296px;width:292px;height:292px;z-index:1;border-radius eft <= 0) return;\n      const total = probs.reduce((a, b) => a + (Number(b) || 0), 0);\n      if (total <= 0) return;\n      let r = Math.random() * total, idx = 0;\n      for (let i = 0; i < n; i++) { r -= Number(probs[i]) || 0; if (r < 0) { idx = i; break; } }\n      const base = this.state.rot - (((this.state.rot % 360) + 360) % 360);\n      const rot = base + 360 * 6 + ((360 - idx * step) % 360);\n      if (this.props.onResult) this.props.onResult(idx, Number(slots[idx]) || 0);\n      else this.setState({ localSpins: Math.max(0, this.state.localSpins - 1) });\n      this.setState({ spinning: true, rot });\n      this.sfx('go'); this.bgmStart(); this.duck(true);\n      setTimeout(() => this.watchTicks(), 30);\n      setTimeout(() => {\n        this.setState({ spinning: false, flash: true });\n        this.sfx('stop');\n        const amt = Number(slots[idx]) || 0;\n        setTimeout(() => this.sfx('win', amt >= 789), 250);\n        setTimeout(() => {\n          const patch = { flash: false, resultIdx: idx };\n          if (!this.props.winners) patch.own = [{ user: 'Pla***4567', amount: amt }].concat(this.state.own);\n          this.setState(patch);\n        }, 1500);\n        setTimeout(() => this.duck(false), 3600);\n      }, 4200);\n    };\n    const closeResult = () => { this.sfx('click'); this.setState({ resultIdx: null }); };\n    const toggleMute = () => {\n      const muted = !this.state.muted;\n      try { localStorage.setItem('wlspin_muted', muted ? '1' : '0'); } catch (e) {}\n      this.setState({ muted });\n      if (muted) this.bgmStop(); else { this.bgmStart(); }\n    };\n    const wins = this.wins();\n    const rowsSrc = wins.length > 2 ? wins.concat(wins.slice(0, 2)) : wins;\n    const tickRows = rowsSrc.map((w) => ({\n      user: w.user,\n      amount: this.fmt(w.amount),\n      amtStyle: 'color:#ffe36a;font-weight:800;text-shadow:-1px -1px 0 #b3140b,1px -1px 0 #b3140b,-1px 1px 0 #b3140b,1px 1px 0 #b3140b;font-size:' + (Number(w.amount) >= 789 ?
