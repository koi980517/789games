<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>白名单转盘原型 v0.5</title>
<style>
:root{--bg:#f4f6f9;--panel:#fff;--ink:#1f2933;--muted:#6b7785;--line:#e3e7ec;--accent:#1d6cae;--accent-soft:#e8f1fa;--stage:#e9edf2}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;font-size:14px}
header{background:#1d6cae;color:#fff;padding:14px 20px;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline}
header h1{margin:0;font-size:18px}
header span{opacity:.85;font-size:12px}
.wrap{display:flex;flex-wrap:wrap;min-height:calc(100vh - 52px)}
nav{flex:0 0 260px;background:var(--panel);border-right:1px solid var(--line);padding:12px 0}
nav h2{font-size:12px;color:var(--muted);margin:14px 18px 6px;font-weight:600;letter-spacing:.04em}
nav button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 18px;font:inherit;color:var(--ink);cursor:pointer;border-left:3px solid transparent}
nav button:hover{background:var(--bg)}
nav button[aria-current="true"]{background:var(--accent-soft);border-left-color:var(--accent);color:var(--accent);font-weight:600}
nav .tag{display:inline-block;margin-left:6px;font-size:10px;padding:0 5px;border-radius:2px;background:#ff8a00;color:#fff;vertical-align:middle}
main{flex:999 1 560px;min-width:0;padding:16px 20px 32px}
.bar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-bottom:12px}
.bar h3{margin:0;font-size:16px}
.back{border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:5px 10px;font:inherit;font-size:12px;cursor:pointer;color:var(--ink)}.back:disabled{opacity:.4;cursor:default}
.hint{font-size:12px;color:var(--muted);margin:0 0 10px}
.bar .meta{color:var(--muted);font-size:12px}
.bar label{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;margin-left:auto}
.stage{background:var(--stage);border:1px solid var(--line);border-radius:8px;padding:16px;overflow:auto}
.frame-box{margin:0 auto;transform-origin:top left}
iframe{border:0;display:block;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.12)}
.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-top:18px}
.note{background:var(--panel);border:1px solid var(--line);border-top:4px solid #c0c4cc;border-radius:6px;padding:12px 14px;white-space:pre-wrap;line-height:1.6;font-size:12px}
.note.blue{border-top-color:#3d8fd8}.note.orange{border-top-color:#ff8a00}.note.pink{border-top-color:#e85d8c}
@media (max-width:760px){nav{flex-basis:100%;border-right:0;border-bottom:1px solid var(--line)}main{padding:12px}}
</style>
</head>
<body>
<header><h1>789games · 白名单转盘原型 v0.5</h1><span>后台 4 张 + 前台 H5 4 张 · 06、08 可交互 · 2026-11-10</span></header>
<div class="wrap">
  <nav id="nav" aria-label="画板"></nav>
  <main>
    <div class="bar"><button type="button" id="back" class="back" disabled>← 上一页</button><h3 id="title"></h3><span class="meta" id="meta"></span>
      <label><input type="checkbox" id="fit" checked> 缩放适配宽度</label></div>
    <p class="hint">所有按钮都能点：跳转（创建 / 修改 / 页签）、弹窗（状态开关、删除、保存校验、导入前须保存）、白名单导入、筛选、下载模板 / 导出 CSV、首页入口 → 转盘 → 中奖弹窗。</p>
    <div class="stage" id="stage"><div class="frame-box" id="box"><iframe id="frame" title="原型画板"></iframe></div></div>
    <div class="notes" id="notes"></div>
  </main>
</div>

var NOTES = [{"page": "后台", "text": "现网读取（QA 后台 2026-11-10）老用户充值转盘\n\n• 菜单 活动中心 › 老用户充值转盘，页签：活动配置｜活动统计\n• 列表：活动编号/名称/类型/开始/结束/创建时间/总预算/已使用预算/创建人/状态（开关）/修改\n• 表单：活动展示开关（控制未登录可见）、名称、开始/结束时间、领取方式（手动/自动）、是否需要 KYC、是否需要充值记录、人群范围（充值次数 ≥ N）、充值渠道（PayMongo/Traxion Pay/PayCools/GCASH）、奖池总预算（空=不限）\n• 档位：首次 / 非首次，每档 = 充值区间 + 最多 2 个奖励金额 + 整数概率\n• 已有「白名单奖励档位」+ 白名单导入（CSV 只有 phone 列，需先保存活动）：白名单手机号充值时改走白名单档位，仍要充值才有次数\n• 流水：首次 / 非首次各配倍数，可勾选是否含本金、是否含奖金\n• 奖励弹窗文案（{bonus}）\n• 统计：会员账号 + 领取时间筛选，导出；领取总额；ID/会员ID/会员账号/活动类型/领取金额/日期/领取时间\n• 接口 /api/admin/activity/oldUserRechargeSpin/*，activityType=OLD_USER_RECHARGE_SPIN", "color": "blue"}, {"page": "后台", "text": "本原型的取舍（橙色角标 = 相对现网的改动）\n\n1. 独立菜单「白名单转盘」，activityType 新建（建议 WHITELIST_SPIN），与老用户充值转盘独立配置、独立预算、独立统计\n2. 去掉：人群范围、充值渠道、是否需要充值记录、旧白名单（手机号）导入、流水「含本金」\n3. 全部为免费转（付费及充值配置已移除）。转盘设置支持多转盘（免费转盘1、2…，最多 5 个），每个转盘独立 10 格奖励 + 概率、不同底色；转数设置里逐转指定用哪个转盘（行底色 = 转盘色）\n4. 不再单独设「白名单发放」页签：在创建 / 编辑页「白名单名单」导入，沿用现有导入逻辑（先保存活动、CSV 首行 phone、导入结果 + BatchId、已导入文件下载）；名单内用户各得 1 轮转数\n5. 次数随活动结束失效；活动关闭时不可抽\n7. 活动列表新增「删除」：仅关闭且无未使用次数可删，软删除，记录保留\n8. 流水要求新增「计入流水的游戏」：全部 / 指定游戏类别（6 类）/ 指定游戏（类别 → 厂商 → 游戏 ID 三级选择弹窗，复用返水活动）\n9. 预算：接入后台顶部「预算告警」（消耗 ≥ 70%，类型名「白名单转盘活动」）；剩余预算 < 最小奖励时活动自动关闭\n10. 权限管理 › 活动中心新增「白名单转盘」101419 及 8 个按钮权限码", "color": "orange"}, {"page": "后台", "text": "待确认\n\n• 大奖格 ₱7,890 是否允许配置大于 0 的概率（目前默认 0，只展示）\n• 免费 / 充值次数是否要不同的有效期或展示文案\n• 预算用完：已发未用次数是不能抽，还是照常发奖\n• 单次 / 单人累计发放上限（原型暂定单次 ≤ 10、批量 ≤ 5,000 行）\n• 是否要求是老用户（充值 ≥1）、冻结 / 风控账号是否拦截\n• 与老用户充值转盘同时有次数时的入口和弹窗优先级\n• 只在 789games 生效还是两站都上", "color": "pink"}, {"page": "前台 H5", "text": "前台规则\n\n• 只有剩余次数 > 0 的白名单用户能看到入口；未登录、非白名单不展示（不复刻老用户转盘的登录前盘面）\n• 发放后首次进入首页弹「获得次数」提示，每个发放批次只弹 1 次；协议弹窗 > 转盘弹窗（-6290）\n• 盘面为 10 格（紫金主题，参考 Super Spin）：10 格金额全部展示（免费格 + 充值格），第 1 格大奖紫底高亮，标题 Jackpot 取 10 格最大值\n• 点 GO → 接口按当前次数类型（免费 / 充值）在该类型的格里按概率返回命中格 index + 金额 → 前端转到该格停下\n• 多条发放记录都有次数时先发先用；底座 Remaining spins = 所有记录剩余之和\n• 接口建议：GET /whitelistSpin/info 返回 slots[10]（金额）、remaining、当前次数类型；POST /whitelistSpin/draw 返回 slotIndex、amount、remaining、grantId\n• "btn\" href=\"Main.dc.html\">返回<\/a>\n\n    <div class=\"row\" style=\"margin-top:12px\"><span class=\"lab\">活动展示开关<\/span><span class=\"ctl\"><span class=\"sw\" role=\"img\" aria-label=\"关闭\"><\/span><span class=\"tip\">开启后，剩余次数 &gt; 0 的白名单用户可看到入口；未登录用户一律不展示<\/span><\/span><\/div>\n\n    <div class=\"sec\">基础配置<\/div>\n    <div class=\"row\"><label class=\"lab\" for=\"n\">* 活动名称<\/label><span class=\"ctl\"><input id=\"n\" class=\"inp\" style=\"width:320px\" value=\"12月召回白名单转盘\"><\/span><\/div>\n    <div class=\"row\"><span class=\"lab\">* 活动开始时间<\/span><span class=\"ctl\"><input class=\"inp\" style=\"width:200px\" value=\"2026-12-01 00:00:00\" aria-label=\"活动开始时间\"><span class=\"tip\">GMT+8<\/span><\/span><\/div>\n    <div class=\"row\"><span class=\"lab\">* 活动结束时间<\/span><span class=\"ctl\"><input class=\"inp\" style=\"width:200px\" value=\"2026-12-31 23:59:59\" aria-label=\"活动结束时间\"><span class=\"tip\">活动结束后，未使用的次数自动失效<\/span><\/span><\/div>\n    <div class=\"row\"><span class=\"lab\">领取方式<\/span><span class=\"ctl\"><label><input type=\"radio\" name=\"r\" checked> 手动领取<\/label><label><input type=\"radio\" name=\"r\"> 自动发放<\/label><\/span><\/div>\n    <div class=\"row\"><span class=\"lab\">是否需要KYC<\/span><span class=\"ctl\"><label><input type=\"radio\" name=\"k\"> 是<\/label><label><input type=\"radio\" name=\"k\" checked> 否<\/label><span class=\"tip\">与现网一致<\/span><\/span><\/div>\n    <div class=\"row\"><label class=\"lab\" for=\"b\">奖池总预算额度<\/label><span class=\"ctl\"><input id=\"b\" class=\"inp\" style=\"width:200px\" value=\"300000\"><span class=\"tip\">留空为不限金额；已使用 ₱0.00<\/span><\/span><\/div>\n    <div class=\"row\"><span class=\"lab\">预算告警<span class=\"new\">接入顶部告警<\/span><\/span><span class=\"ctl\"><span class=\"tip\" style=\"line-height:1.7\">沿用后台顶部「预算告警」：预算消耗 ≥ {{alertPct}}%（全局阈值）时，本活动进入告警列表，显示为「白名单转盘活动 · 活动名 · 消耗率」，告警数 +1。<\/span><\/span><\/div>\n    <div class=\"row\"><span class=\"lab\">预算不足自动关闭<span class=\"new\">新增<\/span><\/span><span class=\"ctl\"><span class=\"tip\" style=\"line-height:1.7\">剩余预算 &lt; 当前最小奖励（<b style=\"color:#303133\">{{minReward}}<\/b>，取所有被使用转盘中概率 &gt; 0 的最小金额）时，活动自动关闭：状态开关变为关闭、前台入口隐藏、未使用次数不可抽，写操作日志并在列表标记「预算不足自动关闭」。补充预算后可手动重新开启。<\/span><\/span><\/div>\n\n    <div class=\"sec\">转数设置<\/div>\n    <div class=\"row\"><span class=\"lab\">每人转数<\/span><span class=\"ctl\" style=\"display:block\">\n      <div class=\"tip\" style=\"margin-bottom:8px\">全部为免费转。逐转选择使用哪个转盘（每个转盘的奖励和概率在下方「转盘设置」配置，行底色 = 转盘颜色），按顺序转，最多 10 转。<\/div>\n      <div class=\"scroll\"><table class=\"tbl\" style=\"max-width:820px\">\n        <thead><tr><th>转次<\/th><th>使用转盘<\/th><th>解锁条件<\/th><th>单转最高奖<\/th><th>单转期望<\/th><th>操作<\/th><\/tr><\/thead>\n        <tbody>\n          <sc-for list=\"{{spinRows}}\" as=\"t\" hint-placeholder-count=\"3\">\n            <tr style=\"{{t.rowStyle}}\"><td><span style=\"{{t.dotStyle}}\" aria-hidden=\"true\"><\/span> 第 {{t.no}} 转<\/td>\n              <td><select class=\"inp\" style=\"width:150px\" value=\"{{t.wheel}}\" onChange=\"{{t.setWheel}}\" aria-label=\"使用转盘\"><sc-for list=\"{{wheelOpts}}\" as=\"o\" hint-placeholder-count=\"2\"><option value=\"{{o.v}}\">{{o.label}}<\/option><\/sc-for><\/select><\/td>\n              <td>{{t.unlock}}<\/td><td>{{t.max}}<\/td><td>{{t.exp}}<\/td>\n              <td><button class=\"btn txt\" onClick=\"{{t.remove}}\" style=\"{{t.delStyle}}\">删除<\/button><\/td><\/tr>\n          <\/sc-for>\n        <\/tbody>\n      <\/table><\/div>\n      <div style=\"display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;margin-top:10px;font-size:12px\">\n        <button class=\"btn\" onClick=\"{{addSpin}}\">+ 新增一转<\/button>\n        <span>每人共 <b>{{spinTotal}}<\/b> 转<\/span>\n        <span>单人最高成本 <b>{{spinMaxCost}}<\/b> · 期望成本 <b>{{spinExpCost}}<\/b><\/span>\n      <\/div>\n    <\/span><\/div>\n\n    <div class=\"sec\" id=\"wl\">白名单名单<span class=\"new\">沿用现有导入逻辑<\/span><\/div>\n    <div class=\"row\"><span class=\"lab\">名单状态<\/span><span class=\"ctl\"><span>{{wlStatus}}<\/span><\/span><\/div>\n    <div class=\"row\"><span class=\"lab\">白名单导入<\/span><span class=\"ctl\" style=\"display:block\">\n      <div style=\"display:flex;flex-wrap:wrap;gap:8px;align-items:center\">\n        <button class=\"btn\" onClick=\"{{importCsv}}\" style=\"{{importStyle}}\">导入文件<\/button>\n        <a class=\"btn\" href=\"{{tplHref}}\" download=\"whitelist_spin_template.csv\">模板下载<\/a>\n        <sc-if value=\"{{hasList}}\" hint-placeholder-val=\"{{false}}\"><a class=\"btn\" href=\"{{exportHref}}\" download=\"whitelist_check.csv\">已导入文件下载<\/a><\/sc-if>\n        <span class=\"tip\">仅支持 CSV（首行表头 phone，每行 1 个 09 开头 11 位手机号）<\/span>\n      <\/div>\n      <sc-if value=\"{{needSave}}\" hint-placeholder-val=\"{{true}}\"><div style=\"color:#e6a23c;font-size:12px;margin-top:6px\">请先保存活动后再导入白名单<\/div><\/sc-if>\n      <sc-if value=\"{{hasResult}}\" hint-placeholder-val=\"{{false}}\">\n        <div style=\"background:#f4f4f5;border-radius:3px;padding:8px 12px;margin-top:8px;font-size:12px;line-height:1.8;max-width:620px\"><b>导入结果：<\/b><br>总行数: {{r.total}} | 有效: {{r.valid}} | 无效: {{r.invalid}} | 文件内重复: {{r.dup}} | 插入: {{r.inserted}} | 已存在: {{r.existed}}<br>BatchId: {{r.batch}}<\/div>\n      <\/sc-if>\n      <div class=\"tip\" style=\"margin-top:8px;line-height:1.7\">名单内每个用户获得 1 轮转数（按上方「转数设置」：第 1–{{spinTotal}} 转）。未注册手机号注册后自动生效；同一手机号重复导入不重复发放。多次导入为追加。<\/div>\n    <\/span><\/div>\n\n    <div class=\"sec\">转盘设置<span class=\"new\">每个转盘独立奖励 + 概率<\/span><\/div>\n    <div class=\"row\"><span class=\"lab\">转盘<\/span><span class=\"ctl\" style=\"display:block\">\n      <div class=\"tip\" style=\"margin-bottom:10px;line-height:1.7\">每个转盘都是一套独立的 10 格奖励（金额）+ 中奖概率（整数，合计 100%，0 = 只展示不命中），顺时针从顶部开始，第 1 格为大奖格。不同转盘用不同底色区分；在上方「转数设置」里指定第几转用哪个转盘，前台转到这一转时，盘面显示该转盘的 10 格金额。<\/div>\n      <div style=\"display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start\">\n        <sc-for list=\"{{wheelCols}}\" as=\"w\" hint-placeholder-count=\"2\">\n          <div style=\"{{w.boxStyle}}\">\n            <div style=\"display:flex;align-items:center;gap:6px;margin-bottom:4px\"><span style=\"{{w.dotStyle}}\" aria-hidden=\"true\"><\/span><input class=\"inp\" style=\"width:130px;padding:3px 6px;font-weight:700\" value=\"{{w.name}}\" onChange=\"{{w.rename}}\" aria-label=\"转盘名称\"><button class=\"btn txt\" onClick=\"{{w.remove}}\" style=\"{{w.delStyle}}\" title=\"{{w.delTitle}}\">删除<\/button><\/div>\n            <div style=\"{{w.usedStyle}}\">{{w.usedBy}}<\/div>\n            <table class=\"tbl\" style=\"background:#fff\">\n              <thead><tr><th style=\"{{w.thStyle}}\">格<\/th><th style=\"{{w.thStyle}}\">奖励金额（₱）<\/th><th style=\"{{w.thStyle}}\">概率<\/th><th style=\"{{w.thStyle}}\">期望<\/th><\/tr><\/thead>\n              <tbody>\n                <sc-for list=\"{{w.rows}}\" as=\"r\" hint-placeholder-count=\"10\">\n                  <tr style=\"{{r.rowStyle}}\"><td style=\"white-space:nowrap\">{{r.no}}<span class=\"tip\">{{r.pos}}<\/span><\/td>\n                    <td><input class=\"inp\" style=\"width:76px\" value=\"{{r.amount}}\" onChange=\"{{r.onAmount}}\" aria-label=\"奖励金额\"><\/td>\n                    <td style=\"white-space:nowrap\"><input class=\"inp\" style=\"{{r.pStyle}}\" value=\"{{r.prob}}\" onChange=\"{{r.onProb}}\" aria-label=\"中奖概率\"> %<\/td>\n                    <td class=\"tip\">{{r.cost}}<\/td><\/tr>\n                <\/sc-for>\n                <tr style=\"{{w.footStyle}}\"><td colspan=\"2\"><b>合计 / 期望 / 最高<\/b><\/td><td><b style=\"{{w.sumStyle}}\">{{w.sum}}%<\/b><\/td><td style=\"font-size:12px;line-height:1.5\">{{w.exp}}<br>最高 {{w.max}}<\/td><\/tr>\n              <\/tbody>\n            <\/table>\n          <\/div>\n        <\/sc-for>\n        <button class=\"btn\" onClick=\"{{addWheel}}\" style=\"width:120px;height:120px;border-style:dashed;font-size:13px\">+ 新增转盘<br><span class=\"tip\">最多 5 个<\/span><\/button>\n      <\/div>\n    <\/span><\/div>\n\n    <div class=\"sec\">流水要求<span class=\"new\">新增指定游戏<\/span><\/div>\n    <div class=\"row\"><label class=\"lab\">彩金提现所需流水倍数<\/label><span class=\"ctl\"><input class=\"inp\" style=\"width:100px\" value=\"{{mult}}\" onChange=\"{{setMult}}\" aria-label=\"流水倍数\"> 倍<span class=\"tip\">稽核流水 = 中奖金额 × 倍数<\/span><\/span><\/div>\n    <div class=\"row\"><span class=\"lab\">稽核流水是否包含奖金<\/span><span class=\"ctl\"><label><input type=\"radio\" name=\"fb\" checked> 是<\/label><label><input type=\"radio\" name=\"fb\"> 否<\/label><\/span><\/div>\n    <div class=\"row\"><span class=\"lab\">计入流水的游戏<\/span><span class=\"ctl\" style=\"display:block\">\n      <div style=\"display:flex;flex-wrap:wrap;gap:16px\">\n        <label><input type=\"radio\" name=\"scope\" checked=\"{{scAll}}\" onChange=\"{{useAll}}\"> 全部游戏<\/label>\n        <label><input type=\"radio\" name=\"scope\" checked=\"{{scCat}}\" onChange=\"{{useCat}}\"> 指定游戏类别<\/label>\n        <label><input type=\"radio\" name=\"scope\" checked=\"{{scGame}}\" onChange=\"{{useGame}}\"> 指定游戏<\/label>\n      <\/div>\n      <sc-if value=\"{{scCat}}\" hint-placeholder-val=\"{{false}}\">\n        <div style=\"display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:10px\">\n          <sc-for list=\"{{catChecks}}\" as=\"c\" hint-placeholder-count=\"6\"><label style=\"display:inline-flex;gap:4px;align-items:center\"><input type=\"checkbox\" checked=\"{{c.on}}\" onChange=\"{{c.toggle}}\"> {{c.name}}<span class=\"tip\">{{c.count}} 款<\/span><\/label><\/sc-for>\n        <\/div>\n        <div class=\"tip\" style=\"margin-top:6px\">只有所选类别下游戏的有效投注计入流水；类别下新上架的游戏自动计入。<\/div>\n      <\/sc-if>\n      <sc-if value=\"{{scGame}}\" hint-placeholder-val=\"{{false}}\">\n        <div style=\"display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px\">\n          <button class=\"btn pri\" onClick=\"{{openPicker}}\">选择游戏<\/button>\n          <span>已选 <b>{{selCount}}<\/b> 款<\/span><span class=\"tip\">{{selSummary}}<\/span>\n        <\/div>\n        <div style=\"display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;max-width:900px\">\n          <sc-for list=\"{{selChips}}\" as=\"g\" hint-placeholder-count=\"6\"><span style=\"background:#ecf5ff;color:#3d8fd8;border-radius:3px;padding:2px 8px;font-size:12px\">{{g.name}} <span class=\"gid\">{{g.id}}<\/span><\/span><\/sc-for>\n        <\/div>\n        <div class=\"tip\" style=\"margin-top:6px\">只有所选游戏的有效投注计入流水；保存时提交游戏 ID。<\/div>\n      <\/sc-if>\n    <\/span><\/div>\n\n    <div class=\"sec\">活动文案配置<\/div>\n    <div class=\"row\"><span class=\"lab\"><label><input type=\"checkbox\" checked> 奖励弹窗文案<\/label><\/span><span class=\"ctl\"><input class=\"inp\" style=\"width:420px\" value=\"Get ₱ {bonus} From Lucky Spin\" aria-label=\"奖励弹窗文案\"><span class=\"tip\">支持 {bonus}<\/span><\/span><\/div>\n    <div class=\"row\"><label class=\"lab\" for=\"g\">获得次数提示文案<\/label><span class=\"ctl\"><input id=\"g\" class=\"inp\" style=\"width:420px\" value=\"You've got {count} Lucky Spins! Spin now to win up to ₱{max}\"><span class=\"tip\">支持 {count} {max}；为空则不弹<\/span><\/span><\/div>\n\n    <div style=\"display:flex;justify-content:center;gap:12px;margin-top:28px\"><a class=\"btn\" href=\"Main.dc.html\">取消<\/a><button class=\"btn pri\" onClick=\"{{save}}\">保存<\/button><\/div>\n  <\/div>\n\n  <sc-if value=\"{{pickerOpen}}\" hint-placeholder-val=\"{{false}}\">\n    <div style=\"{{pickWrap}}\">\n      <div role=\"dialog\" aria-label=\"选择指定游戏\" style=\"width:720px;max-width:calc(100% - 32px);background:#fff;border-radius:6px;box-shadow:0 8px 28px rgba(0,0,0,.25)\">\n        <div style=\"display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid #ebeef5\"><b style=\"font-size:16px\">选择指定游戏 · 白名单转盘流水<\/b><button class=\"btn txt\" onClick=\"{{closePicker}}\" aria-label=\"关闭\" style=\"font-size:18px;color:#909399\">✕<\/button><\/div>\n        <div style=\"padding:12px 20px 0\">\n          <div class=\"tip\" style=\"margin-bottom:8px\">支持 游戏类型 → 游戏厂商 → 具体游戏 三级选择，勾选上级自动联动下级，以最终勾选的游戏范围生效；可按名称或游戏 ID 搜索。<\/div>\n          <div style=\"display:flex;gap:16px;align-items:center;flex-wrap:wrap\">\n            <input class=\"inp\" style=\"width:260px\" placeholder=\"搜索游戏名称 / 游戏ID\" value=\"{{q}}\" onChange=\"{{setQ}}\" aria-label=\"搜索游戏\">\n            <label style=\"font-size:12px;display:inline-flex;gap:4px;align-items:center\"><input type=\"checkbox\" checked=\"{{onlySel}}\" onChange=\"{{toggleOnlySel}}\"> 只看已选<\/label>\n            <span style=\"margin-left:auto\">已选 <b>{{tmpCount}}<\/b> 款<\/span>\n          <\/div>\n        <\/div>\n        <div style=\"margin:10px 20px;border:1px solid #ebeef5;border-radius:4px;height:420px;overflow:auto;padding:10px 12px\">\n          <div style=\"display:flex;align-items:center;gap:6px;font-weight:600;margin-bottom:6px\"><button class=\"{{allCls}}\" onClick=\"{{toggleAll}}\" aria-label=\"全部\">{{allMark}}<\/button>全部 <span class=\"tip\">{{allCnt}}<\/span><\/div>\n          <sc-for list=\"{{tree}}\" as=\"c\" hint-placeholder-count=\"6\">\n            <div style=\"margin:4px 0 4px 18px\">\n              <div style=\"display:flex;align-items:center;gap:6px;font-weight:600\"><button class=\"{{c.cls}}\" onClick=\"{{c.toggle}}\" aria-label=\"{{c.name}}\">{{c.mark}}<\/button><button class=\"btn txt\" onClick=\"{{c.expand}}\" style=\"color:#303133;padding:0;font-weight:600\">{{c.arrow}} {{c.name}}<\/button><span class=\"tip\">{{c.cnt}}<\/span><\/div>\n              <sc-if value=\"{{c.open}}\" hint-placeholder-val=\"{{false}}\">\n                <sc-for list=\"{{c.providers}}\" as=\"p\" hint-placeholder-count=\"2\">\n                  <div style=\"margin:6px 0 6px 22px\">\n                    <div style=\"display:flex;align-items:center;gap:6px;font-weight:600;font-size:12px\"><button class=\"{{p.cls}}\" onClick=\"{{p.toggle}}\" aria-label=\"{{p.name}}\">{{p.mark}}<\/button>{{p.name}} <span class=\"tip\">{{p.cnt}}<\/span><\/div>\n                    <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 12px;margin:6px 0 0 20px\">\n                      <sc-for list=\"{{p.games}}\" as=\"g\" hint-
